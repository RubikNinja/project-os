/* v1.2: responsive appearance system */
:root{color-scheme:dark;--bg:#0b0a11;--side:#11101a;--surface:#191723;--surface2:#242131;--border:#353044;--text:#f3effb;--muted:#aaa4bb;--accent:#b8a1ff;--input:#12101b}
body{background:var(--bg);color:var(--text);transition:background .22s,color .22s}
.sidebar,.mobile-nav{background:var(--side);border-color:var(--border)}
.card,.panel{background:var(--surface);border-color:var(--border);border-radius:21px;box-shadow:0 9px 30px rgba(0,0,0,.07)}
.project-card:hover{border-color:var(--accent);box-shadow:0 12px 35px rgba(145,105,250,.14)}
.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text)}
.muted,.footer{color:var(--muted)}.secondary,.tabs button{background:var(--surface2);color:var(--text)}
.ghost{color:var(--text);border-color:var(--border)}.pill{background:var(--surface2);color:var(--accent)}
input,textarea,select{background:var(--input);color:var(--text);border-color:var(--border)}
.field label{color:var(--muted)}.item{border-color:var(--border)}.empty{border-color:var(--border);color:var(--muted)}
.btn{border-radius:12px}.top{padding-bottom:12px;border-bottom:1px solid var(--border)}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:100px;padding:8px 12px;font-size:13px;font-weight:650}
.theme-toggle:hover{border-color:var(--accent)}.theme-switch{position:relative;width:36px;height:20px;border-radius:30px;background:#71618e;display:inline-block}
.theme-switch:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:white;border-radius:50%;transition:transform .2s}
html[data-theme=light]{color-scheme:light;--bg:#f6f4fa;--side:#fff;--surface:#fff;--surface2:#f0ebf9;--border:#e5dff0;--text:#231d32;--muted:#6e677b;--accent:#7251bc;--input:#faf9fd}
html[data-theme=light] .theme-switch{background:#9c83dc}html[data-theme=light] .theme-switch:after{transform:translateX(16px)}
html[data-theme=light] .brand{color:#231d32}html[data-theme=light] .btn:not(.secondary):not(.ghost):not(.danger){background:#8262d9;color:white}
html[data-theme=light] .notice{background:#f0eafd;color:#473773;border-left-color:#9874e3}
html[data-theme=light] .prompt{background:#faf8ff;border-color:var(--border)}
html[data-theme=light] .tabs button.active{background:#7654c7;color:white}
html[data-theme=light] .mobile-nav button{color:#5e536d}html[data-theme=light] .mobile-nav button.active{color:#714ec2}
html[data-theme=light] .danger{background:#ffe6ec;color:#9e2443}
html[data-theme=light] .done{color:#8d8798}
html[data-theme=light] .card[style*="border-color"]{border-color:#a78bfa!important}
@media(max-width:750px){.theme-toggle{padding:7px 9px}.theme-label{display:none}.top{gap:10px}}
@media print{body{background:white!important;color:black!important}.card,.panel{background:white!important;color:black!important}}

/* Project OS v1.3 color system */
html:not([data-theme=light]){--accent:#aa8cff;--complement:#62ef9b;--surface2:#29253a}
html:not([data-theme=light]) .btn:not(.secondary):not(.ghost):not(.danger){background:#a88bff;color:#171126}
html:not([data-theme=light]) .btn:not(.secondary):not(.ghost):not(.danger):hover{background:#64eea0;color:#082b1b}
html:not([data-theme=light]) .notice{border-left-color:#65ec9e}

html[data-theme=light]{--bg:#f3f7fc;--side:#fff;--surface:#fff;--surface2:#e9f1fd;--border:#d5e2f2;--text:#162842;--muted:#58718f;--accent:#2264c9;--input:#fbfdff;--complement:#fa3e55}
html[data-theme=light] .btn:not(.secondary):not(.ghost):not(.danger){background:#2264c9;color:#fff}
html[data-theme=light] .btn:not(.secondary):not(.ghost):not(.danger):hover{background:#fa3e55;color:#fff}
html[data-theme=light] .brand span,html[data-theme=light] .stat{color:#ef3653}

html[data-theme=light] .tabs button.active{background:#2264c9;color:white}
html[data-theme=light] .mobile-nav button.active{color:#2264c9}

 .mobile-nav button.active{background:var(--surface2)}
 .card,.panel{border-radius:20px;padding:17px}.project-grid{gap:12px}.cards{gap:10px}
 .btn,.secondary,.ghost,.danger{min-height:44px}input,select,textarea{font-size:16px;min-height:44px}
 .tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{min-height:44px}
 .card-edit{width:44px;height:44px}.item input[type=checkbox]{width:22px;height:22px;flex-shrink:0}
 .modal-backdrop{align-items:flex-end;padding:0}.modal-dialog{width:100%;max-height:88dvh;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
 .row{min-width:0}pre,code{overflow-wrap:anywhere}textarea{max-width:100%}
}
@media(max-width:380px){.cards{grid-template-columns:1fr 1fr}.card,.panel{padding:13px}.mobile-nav button{min-width:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
.date-open-option{display:flex;align-items:center;gap:10px;margin:10px 0 18px;cursor:pointer;font-size:14px}.date-open-option input{width:18px;height:18px;flex:none;accent-color:var(--accent)}input[type="date"]{min-height:44px;color-scheme:dark}html[data-theme="light"] input[type="date"]{color-scheme:light}

const KEY='project-os-v1';const PHILOSOPHY_KEY='project-os-philosophy-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{projects:[]}}catch{db={projects:[]}};let view='home',selected=null,tab='overview';const phases=['Brainstorm','Differentiate','Possibilities','Constraints','Introduce','Execute','Measure','Diagnose','Adjust','Repeat'];const prompts={Brainstorm:'What is the idea, and what do you want to accomplish?',Differentiate:'What makes this worth doing instead of an ordinary alternative?',Possibilities:'What resources, opportunities, skills, or connections could help?',Constraints:'What limits exist? Which could inspire a different approach?',Introduce:'Who needs to understand, support, or experience this idea?',Execute:'What would a realistic first version look like?',Measure:'What observations would indicate success or failure?',Diagnose:'If results disappoint, what possible explanations should we investigate?',Adjust:'What would we change based on evidence?',Repeat:'What should the next iteration test?'};

{id:'loop',title:'The Idea Loop',text:'Brainstorm → Differentiate → Possibilities → Constraints → Introduce → Execute → Measure → Diagnose → Adjust → Repeat. Revisit possibilities when constraints arise, and distinguish observed results from possible explanations.',context:'A flexible process, not a mandatory checklist. Adapt it to project scale and revisit stages as needed.',source:'Working summary of your Idea Loop; editable.'}

let philosophy;try{philosophy=JSON.parse(localStorage.getItem(PHILOSOPHY_KEY));if(!Array.isArray(philosophy))philosophy=null}catch{philosophy=null}if(!philosophy)philosophy=structuredClone(defaultPrinciples);

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function project(){return db.projects.find(p=>p.id===selected)}function go(v){view=v;render()}function openProject(id){selected=id;view='project';tab='overview';render()}function btn(label,fn,cl='secondary'){return `<button class="btn ${cl}" onclick="${fn}">${label}</button>`}function nav(){let n=[['home','⌂','Home'],['projects','▣','Projects'],['tasks','☑','Tasks'],['lists','☷','Lists'],['archive','▤','Archive'],['settings','⚙','Settings']];return `<aside class="sidebar"><div class="brand">PROJECT <span>OS</span></div><div class="nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div></aside><nav class="mobile-nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><div style="font-size:19px">${x[1]}</div>${x[2]}</button>`).join('')}</nav>`}const THEME_KEY='project-os-theme';let currentTheme=localStorage.getItem(THEME_KEY)||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');function applyTheme(){document.documentElement.dataset.theme=currentTheme;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',currentTheme==='light'?'#f3f7fc':'#0b0a11')}function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,currentTheme);applyTheme();render()}function themeButton(){return `<button class="theme-toggle no-print" onclick="toggleTheme()" aria-label="Switch to ${currentTheme==='dark'?'light':'dark'} mode" title="Toggle light and dark mode"><span>${currentTheme==='dark'?'☾':'☀'}</span><span class="theme-label">${currentTheme==='dark'?'Dark':'Light'}</span><span class="theme-switch" aria-hidden="true"></span></button>`}applyTheme();function shell(title,actions,content){$('#app').innerHTML=`<div class="shell">${nav()}<main class="main"><div class="top"><h1 class="${view==='home'?'editorial-title':''}">${title}</h1><div class="row no-print">${actions||''}${themeButton()}</div></div>${content}<div class="footer">Project OS · Local prototype · Your data is saved in this browser. Export backups regularly.</div></main></div>`}const DEFAULT_SECTIONS=['Work','Personal'];let sectionFilter='all';function sections(){return [...new Set([...DEFAULT_SECTIONS,...(db.sections||[]),...db.projects.map(p=>p.section||'Uncategorized')])]}function sectionOptions(current){return sections().map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(x)}</option>`).join('')}function chooseSection(){let available=sections();let choice=prompt('Which section does this project belong to?\n\nExisting sections: '+available.join(', ')+'\n\nEnter an existing section or a new name:','Personal');if(choice===null)return null;choice=choice.trim();if(!choice){alert('Please enter a section name.');return null}if(choice.length>60){alert('Section names must be 60 characters or fewer.');return null}let existing=available.find(x=>x.toLowerCase()===choice.toLowerCase());choice=existing||choice;db.sections||=[];if(!db.sections.includes(choice))db.sections.push(choice);return choice}function setProjectSection(v){const p=project();if(!p)return;p.section=v;save();render()}function manageSections(){let name=prompt('Add a section (e.g. School, Music, Family):');if(name===null)return;name=name.trim();if(!name||name.length>60){alert('Enter a section name of up to 60 characters.');return}if(sections().some(x=>x.toLowerCase()===name.toLowerCase())){alert('That section already exists.');return}db.sections||=[];db.sections.push(name);save();render()}function setSectionFilter(v){sectionFilter=v;render()}function sectionPicker(){return `<div class="row no-print" style="margin:0 0 16px"><label class="muted small">Section <select style="width:auto;min-width:150px" onchange="setSectionFilter(this.value)"><option value="all">All sections</option>${sections().map(x=>`<option value="${esc(x)}" ${sectionFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${btn('+ Add section','manageSections()','ghost mini')}</div>`}function inSection(p){return sectionFilter==='all'||(p.section||'Uncategorized')===sectionFilter}function sectionTag(p){return `<span class="pill" style="background:#263b46;color:#bce5ec">${esc(p.section||'Uncategorized')}</span>`}function summary(){let tasks=db.projects.flatMap(p=>p.tasks||[]);return {projects:db.projects.length,open:tasks.filter(t=>!t.done).length,done:tasks.filter(t=>t.done).length,items:db.projects.flatMap(p=>p.items||[]).filter(i=>!i.done).length}}function projCard(p){let all=p.tasks.length,done=p.tasks.filter(t=>t.done).length;return `<div class="card project-card" onclick="openProject('${p.id}')"><div class="row between"><span class="pill">${esc(p.status)}</span>${sectionTag(p)}<span class="muted small">${all?Math.round(done/all*100):0}%</span></div><h2 style="margin:17px 0 7px">${esc(p.name)}</h2><p class="muted small">${esc(p.description||'No description yet')}</p><div class="muted small">${done}/${all} tasks complete</div><button class="card-edit no-print" title="Edit project" aria-label="Edit ${esc(p.name)}" onclick="event.stopPropagation();editProjectMenu('${p.id}')">✎</button></div>`}function home(){

function projects(){let visible=db.projects.filter(p=>p.status!=='Archived'&&inSection(p));shell('Projects',btn('+ New project','createProject()',''),sectionPicker()+(visible.length?`<div class="project-grid">${visible.map(projCard).join('')}</div>`:`<div class="empty">No projects in this section yet.</div>`))}function dateToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localClockContext(){const d=new Date();return `CURRENT LOCAL DATE: ${dateToday()}. CURRENT LOCAL TIME: ${d.toLocaleString()}. IANA TIME ZONE: ${Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'}. Today's date is authoritative, not any date inferred from training data. Never propose new dates before today unless the user explicitly requests a retrospective/historical plan. Past existing deadlines are historical/overdue, not future recommendations. If a requested deadline is past, explain it and ask whether to reschedule or create a recovery plan. If the deadline is open-ended, do not invent one; suggest undated next steps or ask whether the user wants a target. When you ask the user for a deadline, tell them to use the project's calendar date picker or choose To be decided / Open-ended.`}
function validISODate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const d=new Date(s+'T12:00:00');return !Number.isNaN(d.getTime())&&`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===s}
function datePickerMarkup(id,value='',allowOpen=true){return `<div class="field"><label for="${id}">Choose a date</label><input type="date" id="${id}" value="${esc(value)}" ${allowOpen?'':''}></div>${allowOpen?`<label class="date-open-option"><input type="checkbox" id="${id}-open" ${value?'':' '} onchange="document.getElementById('${id}').disabled=this.checked;if(this.checked)document.getElementById('${id}').value=''"> To be decided / Open-ended</label>`:''}`}
function datePickerValue(id){const open=document.getElementById(id+'-open');if(open?.checked)return '';const v=document.getElementById(id)?.value||'';if(!validISODate(v)){alert('Choose a valid date, or select To be decided / Open-ended.');return null}return v}
function createProject(){
 const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='project-date-modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};
 overlay.innerHTML=`<div class="modal-dialog" role="dialog" aria-modal="true" aria-label="New project setup"><div class="row between"><h2>Create a new project</h2><button class="btn ghost mini" onclick="document.getElementById('project-date-modal').remove()" aria-label="Close">✕</button></div><div class="field"><label for="new-project-section">Section</label><select id="new-project-section" onchange="toggleNewProjectSection(this.value)">${sections().map(x=>`<option value="${esc(x)}" ${x==='Personal'?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new__">+ Add new section…</option></select></div><div class="field" id="new-project-section-wrap" style="display:none"><label for="new-project-section-name">New section name</label><input id="new-project-section-name" maxlength="60" placeholder="e.g. Family, Music, School"></div><h3>When should this project be finished?</h3><p class="muted small">Pick a date on the calendar, or check the open-ended option.</p>${datePickerMarkup('new-project-date')}<div class="row"><button class="btn" onclick="finishCreateProject()">Create project</button><button class="btn secondary" onclick="document.getElementById('project-date-modal').remove()">Cancel</button></div></div>`;

function toggleNewProjectSection(value){const wrap=document.getElementById('new-project-section-wrap');if(wrap)wrap.style.display=value==='__new__'?'block':'none';if(value==='__new__')document.getElementById('new-project-section-name')?.focus()}

 if(section==='__new__'){section=(document.getElementById('new-project-section-name')?.value||'').trim();if(!section||section.length>60){alert('Enter a section name (up to 60 characters).');return}section=sections().find(x=>x.toLowerCase()===section.toLowerCase())||section;db.sections||=[];if(!db.sections.includes(section))db.sections.push(section)}
 const deadline=datePickerValue('new-project-date');if(deadline===null)return;
 const p={id:uid(),name:'Untitled project',section,description:'',status:'Idea proofing',goal:'',success:'',audience:'',budget:'',deadline,deadlineType:'target',tasks:[],items:[],notes:'',phases:{},decisions:[],created:new Date().toISOString(),nameAutoDecided:false};
 db.projects.unshift(p);save();document.getElementById('project-date-modal')?.remove();selected=p.id;view='project';tab='consultant';render();setTimeout(()=>document.getElementById('consultant-message')?.focus(),0)
}

 document.getElementById('project-edit-modal')?.remove();

function closeProjectMenu(){document.getElementById('project-edit-modal')?.remove()}
function saveProjectMenu(id){const p=db.projects.find(x=>x.id===id);if(!p)return;const name=document.getElementById('edit-project-name')?.value.trim();if(!name){alert('Enter a project name.');return}const status=document.getElementById('edit-project-status').value;const section=document.getElementById('edit-project-section').value;if(p.name!==name)p.nameManuallyEdited=true;p.name=name;p.section=section;if(p.status!==status){p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:'Status changed to '+status});p.status=status}save();closeProjectMenu();render()}
function archiveFromMenu(id){const p=db.projects.find(x=>x.id===id);if(!p)return;p.status=p.status==='Archived'?'Planning':'Archived';p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:p.status==='Archived'?'Project archived':'Project restored from archive'});save();closeProjectMenu();render()}
function deleteFromMenu(id){closeProjectMenu();deleteProject(id)}
function deleteProject(id){const p=db.projects.find(x=>x.id===id);if(!p)return;const typed=prompt('Permanently delete \"'+p.name+'\" and all its tasks, lists, notes, and AI conversation?\n\nThis cannot be undone. Type the exact project name to confirm:');if(typed===null)return;if(typed!==p.name){alert('Project name did not match. Nothing was deleted.');return;}db.projects=db.projects.filter(x=>x.id!==id);if(selected===id){selected=null;view='projects';tab='overview';}if(taskFilter===id)taskFilter='all';save();render();} 
function field(label,key,area=false){let p=project(),value=esc(p[key]||'');return `<div class="field"><label>${label}</label>${area?`<textarea oninput="setField('${key}',this.value)">${value}</textarea>`:`<input value="${value}" oninput="setField('${key}',this.value)">`}</div>`}function setField(k,v){project()[k]=v;save()}function changeStatus(v){const p=project();p.status=v;p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:'Status changed to '+v});save();render()}function phaseContent(){let p=project();return `<div class="notice">The Idea Loop is a structured reflection tool, not an AI chat. Use it to record reasoning, uncertainty, experiments, and lessons.</div><div class="steps">${phases.map((ph,i)=>`<div class="step"><h3>${i+1}. ${ph}</h3><p>${prompts[ph]}</p><textarea aria-label="${ph}" placeholder="Your reasoning, evidence, questions, or next experiment..." oninput="setPhase('${ph}',this.value)">${esc(p.phases[ph]||'')}</textarea></div>`).join('')}</div>`}function setPhase(ph,v){project().phases[ph]=v;save()}function checkItem(type,id,checked){let p=project(),x=p[type].find(x=>x.id===id);if(x){x.done=checked;if(type==='tasks'){x.completedAt=checked?new Date().toISOString():null;if(checked){x.completedBy=prompt('Completed by (optional):',x.completedBy||'')||'';let link=prompt('Deliverable URL, e.g. Google Drive share link (optional):',x.deliverable||'');if(link&&/^https:\/\//i.test(link))x.deliverable=link;else if(link)alert('Please use an https:// link.');}p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:(checked?'Completed':'Reopened')+' task: '+x.text+(x.completedBy?' by '+x.completedBy:'')});}save();render()}}function addItem(type){let v=$('#new-'+type)?.value.trim();if(!v)return;project()[type].push({id:uid(),text:v,done:false,priority:'medium',due:'',created:new Date().toISOString()});save();render()}function removeItem(type,id){project()[type]=project()[type].filter(x=>x.id!==id);save();render()}function taskMeta(t){return `${t.due?'Due '+esc(t.due)+' · ':''}${esc(t.priority||'medium')} priority${t.completedBy?' · by '+esc(t.completedBy):''}${t.completedAt?' · '+new Date(t.completedAt).toLocaleDateString():''}${t.deliverable?' · <a href="'+esc(t.deliverable)+'" target="_blank" rel="noopener noreferrer">Deliverable ↗</a>':''}`}
function openEntryDatePicker(type,id){const t=project()?.[type]?.find(x=>x.id===id);if(!t)return;document.getElementById('entry-date-modal')?.remove();const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='entry-date-modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.innerHTML=`<div class="modal-dialog" role="dialog" aria-modal="true"><div class="row between"><h2>${type==='tasks'?'Task due date':'Item needed by'}</h2><button class="btn ghost mini" onclick="document.getElementById('entry-date-modal').remove()">✕</button></div><p class="muted small">${esc(t.text)}</p>${datePickerMarkup('entry-due-date',t.due||'')}<button class="btn" onclick="saveEntryDate('${type}','${id}')">Save date</button></div>`;document.body.appendChild(overlay);if(!t.due)document.getElementById('entry-due-date').disabled=true}
function saveEntryDate(type,id){const due=datePickerValue('entry-due-date');if(due===null)return;const t=project()?.[type]?.find(x=>x.id===id);if(t)t.due=due;save();document.getElementById('entry-date-modal')?.remove();render()}
function editTask(id){let t=project().tasks.find(x=>x.id===id);if(!t)return;let text=prompt('Task description:',t.text);if(text===null)return;let priority=prompt('Priority: critical, high, medium, low',t.priority||'medium');if(priority===null)return;t.text=text.trim()||t.text;t.priority=['critical','high','medium','low'].includes(priority.toLowerCase())?priority.toLowerCase():'medium';save();openEntryDatePicker('tasks',id)}
function editListEntry(type,id){if(type==='tasks'){editTask(id);return;}let t=project().items.find(x=>x.id===id);if(!t)return;let text=prompt('Item or purchase:',t.text);if(text===null)return;let priority=prompt('Priority: critical, high, medium, low',t.priority||'medium');if(priority===null)return;t.text=text.trim()||t.text;t.priority=['critical','high','medium','low'].includes(priority.toLowerCase())?priority.toLowerCase():'medium';save();openEntryDatePicker(type,id)}
function listEditor(type,label){let p=project();return `<div class="panel"><h2>${label}</h2><div class="row no-print" style="margin-bottom:10px"><input style="flex:1" id="new-${type}" placeholder="Add ${type==='tasks'?'a task':'an item'}..." onkeydown="if(event.key==='Enter')addItem('${type}')">${btn('Add',`addItem('${type}')`,'')}</div>${p[type].length?p[type].map(x=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="checkItem('${type}','${x.id}',this.checked)"><div class="grow ${x.done?'done':''}">${esc(x.text)}<div class="muted small">${taskMeta(x)}</div></div><button class="mini ghost no-print" onclick="editListEntry('${type}','${x.id}')">Edit</button><button class="mini ghost no-print" onclick="removeItem('${type}','${x.id}')">Remove</button></div>`).join(''):`<div class="muted small">Nothing here yet.</div>`}</div>`}
function decision(){let d=prompt('What decision did you make?');if(!d?.trim())return;let why=prompt('Why? Include evidence, assumptions, and tradeoffs:')||'';project().decisions.unshift({id:uid(),decision:d,why,date:new Date().toLocaleDateString()});save();render()}function projectView(){let p=project();if(!p){go('projects');return}let tabs=[['overview','Overview'],['consultant','AI Consultant'],['proof','Idea Loop'],['tasks','Tasks'],['items','Item lists'],['notes','Documents'],['decisions','Decisions'],['review','Philosophy Review']];let actions=`${btn('Print / PDF','printProject()','secondary')}${btn('Export JSON','exportProject()','ghost')}${btn('Delete project',`deleteProject('${p.id}')`,'danger')}`;let content=`<div class="row between" style="margin-bottom:17px"><div class="muted small">Created ${new Date(p.created).toLocaleDateString()}</div><select style="width:auto" onchange="changeStatus(this.value)">${['Idea proofing','Planning','In progress','On hold','In review','Completed','Archived'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tabs no-print">${tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
if(tab==='review')content+=philosophyReviewPanel();if(tab==='overview')content+=`<div class="split"><div class="panel"><h2>Project brief</h2>${field('Project name','name')}<div class="field"><label>Section</label><select onchange="setProjectSection(this.value)">${sectionOptions(p.section||'Uncategorized')}</select></div>${field('The idea','description',true)}${field('Goal / purpose','goal',true)}${field('What would success look like?','success',true)}${field('Who is it for?','audience')}</div><div class="stack"><div class="panel"><h2>Practical constraints</h2>${field('Budget / resources','budget')}${`<div class="field"><label for="project-deadline">Final project deadline</label><input id="project-deadline" type="date" value="${esc(p.deadline||'')}" onchange="setProjectDeadline(this.value)" ${p.deadline?'':'disabled'}><label class="date-open-option"><input type="checkbox" ${p.deadline?'':'checked'} onchange="document.getElementById('project-deadline').disabled=this.checked;if(this.checked){document.getElementById('project-deadline').value='';setProjectDeadline('')}"> To be decided / Open-ended</label></div>`}<div class="field"><label>Deadline type</label><select onchange="setField('deadlineType',this.value)"><option value="target" ${p.deadlineType!=='hard'?'selected':''}>Flexible target</option><option value="hard" ${p.deadlineType==='hard'?'selected':''}>Hard deadline</option></select></div><p class="muted small">The AI uses this date to recommend deadlines for tasks and purchases. If it changes, ask the consultant to revise the schedule.</p><p class="muted small">A date is a preference until its feasibility and dependencies are checked.</p></div><div class="panel"><h2>Critical questions</h2><div class="muted small">Why does this matter? What assumptions could be wrong? What is the cheapest useful experiment? What would make you change course?</div></div></div></div>`;
if(tab==='consultant')content+=consultantPanel();if(tab==='proof')content+=`<div class="panel"><h2>Idea proofing</h2>${phaseContent()}</div>`;
if(tab==='tasks')content+=listEditor('tasks','Project tasks');if(tab==='items')content+=listEditor('items','Shopping, supplies & equipment');if(tab==='notes')content+=`<div class="panel"><h2>Living project plan</h2><p class="muted small">AI-drafted plan. Edit freely; changes save locally. The activity log below records task completions and status changes.</p><textarea style="min-height:260px" oninput="setField('plan',this.value)">${esc(p.plan||'')}</textarea><h2>Project notes</h2><textarea style="min-height:160px" oninput="setField('notes',this.value)">${esc(p.notes||'')}</textarea><h2>Activity log</h2>${(p.activity||[]).slice(0,40).map(a=>`<div class="item"><span class="muted small">${new Date(a.at).toLocaleString()}</span><span>${esc(a.event)}</span></div>`).join('')||'<p class="muted small">No recorded changes yet.</p>'}</div>`;if(tab==='decisions')content+=`<div class="panel"><div class="row between"><h2>Decision log</h2>${btn('+ Record decision','decision()','')}</div>${p.decisions.length?p.decisions.map(d=>`<div class="item"><div><strong>${esc(d.decision)}</strong><div class="muted small">${esc(d.date)}</div><p>${esc(d.why)}</p></div></div>`).join(''):`<p class="muted">Record decisions and their rationale so you can revisit them later.</p>`}</div>`;shell(esc(p.name),actions,content)}function archive(){let ps=db.projects.filter(p=>(p.status==='Archived'||p.status==='Completed')&&inSection(p));shell('Completed & archive','',sectionPicker()+(ps.length?`<div class="project-grid">${ps.map(projCard).join('')}</div>`:'<div class="empty">No completed or archived projects in this section.</div>'))}
function setTaskSort(v){taskSort=v;render()}function setTaskFilter(v){taskFilter=v;render()}
function allList(type){let rows=db.projects.filter(inSection).flatMap(p=>(p[type]||[]).map(x=>({...x,projectName:p.name,projectSection:p.section||'Uncategorized',projectId:p.id})));if(type==='tasks'){let projects=[...new Set(rows.map(t=>t.projectId))];let rank={critical:4,high:3,medium:2,low:1};let due=t=>t.due?new Date(t.due+'T12:00:00').getTime():Infinity;rows=rows.filter(t=>taskFilter==='all'||t.projectId===taskFilter).sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(taskSort==='project')return a.projectName.localeCompare(b.projectName)||due(a)-due(b);if(taskSort==='importance')return (rank[b.priority]||2)-(rank[a.priority]||2)||due(a)-due(b);return due(a)-due(b)||(rank[b.priority]||2)-(rank[a.priority]||2)});let filters=sectionPicker()+`<div class="row no-print" style="margin-bottom:14px;flex-wrap:wrap"><label>Sort <select onchange="setTaskSort(this.value)"><option value="urgent" ${taskSort==='urgent'?'selected':''}>Due date first</option><option value="importance" ${taskSort==='importance'?'selected':''}>Importance first</option><option value="project" ${taskSort==='project'?'selected':''}>By project</option></select></label><label>Project <select onchange="setTaskFilter(this.value)"><option value="all">All projects</option>${db.projects.map(p=>`<option value="${p.id}" ${taskFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label></div>`;shell('All tasks',btn('+ New project','createProject()',''),filters+(rows.length?`<div class="panel">${rows.map(t=>`<div class="item"><span>${t.done?'✓':'○'}</span><div class="grow ${t.done?'done':''}"><strong>${esc(t.text)}</strong><div class="muted small">${esc(t.projectName)} · ${esc(t.projectSection)} · ${taskMeta(t)}</div></div>${btn('Open',`openProject('${t.projectId}');tab='tasks';render()`,'ghost')}</div>`).join('')}</div>`:'<div class="empty">No tasks found.</div>'));return}shell('All item lists','',sectionPicker()+(rows.length?`<div class="panel">${rows.map(x=>`<div class="item"><span>${x // Retry transient Gemini/Worker failures without duplicating chat messages or project edits.
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function geminiRequest(messages,onRetry){
 const delays=[1000,2500,5000];
 for(let attempt=0;;attempt++){
  try{
   const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Access-Pin':accessPassword},body:JSON.stringify({messages:[{role:'user',content:localClockContext()},...messages]})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok){const err=new Error((data.error||'Request failed')+(data.status?' (Gemini status '+data.status+')':''));err.status=Number(data.status)||r.status;throw err;}
   if(typeof data.reply!=='string'||!data.reply.trim())throw Error('No response from Gemini');
   return data.reply;
  }catch(e){
   const transient=[429,500,502,503,504].includes(e.status)||e instanceof TypeError;
   if(!transient||attempt>=delays.length)throw e;
   const seconds=Math.round(delays[attempt]/1000);
   onRetry?.(`Gemini is temporarily busy. Retrying ${attempt+1} of ${delays.length} in about ${seconds} seconds…`);
   await wait(delays[attempt]);
  }
 }
}

rmed details, assumptions, open questions and next steps. Add only meaningful new tasks, not duplicates. Do NOT set status to Completed or Archived. If the user has provided new project information, you MUST update at least one relevant field, especially the living plan. Existing project: ${snapshot()}\nLatest user message: ${msg}\nConsultant response: ${answer.slice(0,3500)}`;

function discardPhilosophyDraft(){philosophyDraft=null;render()}
function applyPhilosophyDraft(){if(!philosophyDraft)return;for(const d of philosophyDraft){if(d.action==='update'){const target=philosophy.find(p=>p.id===d.id);if(!target)continue;target.title=d.title;target.text=d.text;target.context=d.context}else if(d.action==='add'){philosophy.push({id:uid(),title:d.title,text:d.text,context:d.context,source:'AI-assisted draft approved by you'})}}savePhilosophy();philosophyDraft=null;render();alert('Approved changes saved to your Philosophy Library.')}
async function sendPhilosophyAI(){if(philosophyBusy)return;const msg=$('#philosophy-ai-message')?.value.trim();if(!msg)return;if(!accessPassword){const pin=prompt('Enter your Cloudflare ACCESS_PIN (once per page session):');if(!pin)return;accessPassword=pin}philosophyChat.push({role:'user',content:msg});localStorage.setItem(PHILOSOPHY_CHAT_KEY,JSON.stringify(philosophyChat.slice(-40)));philosophyBusy=true;render();try{const instructions=`You are a thoughtful philosophy editor. Discuss the user's ideas respectfully; challenge assumptions without turning their beliefs into rigid laws. Do not claim that AI-generated wording is the user's original text. The user wants to ADD or REFORMAT principles in a personal philosophy library. Respond ONLY with a valid JSON object in this shape: {"reply":"Your conversational response and reasoning","changes":[{"action":"add","title":"...","text":"...","context":"..."},{"action":"update","id":"EXISTING_ID","title":"...","text":"...","context":"..."}]}. Include changes only when the user clearly requests a modification. Never invent a matching ID. Use the original entry's ID for updates. Preserve the original meaning unless the user asks to change it. You can return an empty changes array when discussing ideas. At most 5 changes per turn. CURRENT LIBRARY: ${JSON.stringify(philosophy).slice(0,12500)}\nRECENT CHAT: ${JSON.stringify(philosophyChat.slice(-8)).slice(0,5500)}\nLATEST REQUEST: ${msg}`;const raw=await geminiRequest([{role:'user',content:instructions}],t=>{const el=$('#philosophy-ai-status');if(el)el.textContent=t});let parsed;try{parsed=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''))}catch{parsed={reply:raw,changes:[]}}philosophyChat.push({role:'assistant',content:String(parsed.reply||'I prepared a proposal for your review.').slice(0,6000)});localStorage.setItem(PHILOSOPHY_CHAT_KEY,JSON.stringify(philosophyChat.slice(-40)));if(Array.isArray(parsed.changes)){const valid=[];for(const c of parsed.changes.slice(0,5)){if(!c||!['add','update'].includes(c.action)||typeof c.title!=='string'||typeof c.text!=='string'||!c.title.trim()||!c.text.trim())continue;if(c.action==='update'&&!philosophy.some(x=>x.id===c.id))continue;valid.push({action:c.action,id:c.id,title:c.title.slice(0,160),text:c.text.slice(0,5000),context:typeof c.context==='string'?c.context.slice(0,3000):''})}philosophyDraft=valid.length?valid:null}}catch(e){alert('Philosophy AI problem: '+e.message);if(/password/i.test(e.message))accessPassword=''}finally{philosophyBusy=false;render()}}

function philosophyReviewPanel(){const p=project();const reviews=p.philosophyReviews||[];return `<div class="panel"><h2>Review against your philosophy</h2><p class="muted small">Gemini evaluates your current project using your editable Philosophy Library. It should distinguish evidence from assumptions, explain when a principle is irrelevant, and preserve calculated creative risks. Reviews are advisory: they do not change tasks, status, or the project brief.</p><div class="row no-print">${btn(reviewBusy?'Reviewing…':'Run philosophy review','runPhilosophyReview()','')}${btn('Edit philosophy library',"go('philosophy')",'secondary')}</div><p id="review-status" class="muted small" role="status"></p></div>${reviews.length?reviews.map((r,i)=>`<div class="panel" style="margin-top:14px"><div class="row between"><h2 style="margin:0">${i===0?'Latest review':'Earlier review'}</h2><span class="muted small">${esc(new Date(r.at).toLocaleString())}</span></div><div style="white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65">${esc(r.text)}</div></div>`).join(''):'<div class="empty" style="margin-top:14px">No philosophy reviews yet. Run one to examine this project.</div>'}`}
let reviewBusy=false;
async function runPhilosophyReview(){
 if(reviewBusy)return;
 const p=project();if(!p)return;
 if(!philosophy.length){alert('Add a principle to your Philosophy Library first.');return}
 if(!accessPassword){const pin=prompt('Enter your Cloudflare ACCESS_PIN (once per page session):');if(!pin)return;accessPassword=pin}
 reviewBusy=true;render();const status=$('#review-status');if(status)status.textContent='Reviewing your project against the Philosophy Library…';
 const projectData={name:p.name,description:p.description,goal:p.goal,success:p.success,audience:p.audience,budget:p.budget,deadline:p.deadline,deadlineType:p.deadlineType||'target',status:p.status,phases:p.phases,plan:(p.plan||'').slice(0,3500),tasks:(p.tasks||[]).slice(0,35).map(t=>({text:t.text,done:t.done,due:t.due,priority:t.priority})),decisions:(p.decisions||[]).slice(0,12)};
 const instructions=`Perform a thoughtful PHILOSOPHY REVIEW for this project. This is an advisory review, not an instruction to change the project. Apply only relevant principles, explicitly say when a principle does not apply, distinguish verified facts from assumptions and hypotheses, identify strengths and contradictions, and recommend proportionate experiments or adjustments. Challenge assumptions, not ambition; validation is not consensus. Do not invent evidence or claim any task is completed unless recorded. Use headings: Overall assessment; Relevant principles; Strengths; Gaps and assumptions; Calculated risks and experiments; Next question. Ask at most one high-value question.\n\nPERSONAL PHILOSOPHY LIBRARY (user-editable; not absolute rules):\n${JSON.stringify(philosophy.map(x=>({title:x.title,text:x.text,context:x.context}))).slice(0,10000)}\n\nCURRENT PROJECT:\n${JSON.stringify(projectData).slice(0,9000)}`;
 try{
  const reply=await geminiRequest([{role:'user',content:instructions}],text=>{const el=$('#review-status');if(el)el.textContent=text});
  p.philosophyReviews ||= [];p.philosophyReviews.unshift({at:new Date().toISOString(),text:reply,principles:philosophy.map(x=>({title:x.title,text:x.text,context:x.context}))});p.philosophyReviews=p.philosophyReviews.slice(0,20);p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:'Ran a philosophy review (advisory; no project fields changed)'});save();
 }catch(e){alert('Philosophy review failed: '+e.message+'\n\nNo project data was changed.');if(/password/i.test(e.message))accessPassword=''}
 finally{reviewBusy=false;render()}
}
function render(){if(view==='philosophy')philosophyPage();else if(view==='archive')archive();else if(view==='home')home();else if(view==='projects')projects();else if(view==='project')projectView();else if(view==='tasks'||view==='lists')allList(view==='tasks'?'tasks':'items');else settings()}render();
</script><script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline install unavailable:',err)));}
</script></body></html>
