/* v1.2: responsive appearance system */

body{background:var(--bg);color:var(--text);transition:background .22s,color .22s}
.sidebar,.mobile-nav{background:var(--side);border-color:var(--border)}
.card,.panel{background:var(--surface);border-color:var(--border);border-radius:21px;box-shadow:0 9px 30px rgba(0,0,0,.07)}

.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text)}

input,textarea,select{background:var(--input);color:var(--text);border-color:var(--border)}
.field label{color:var(--muted)}.item{border-color:var(--border)}.empty{border-color:var(--border);color:var(--muted)}
.btn{border-radius:12px}.top{padding-bottom:12px;border-bottom:1px solid var(--border)}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:100px;padding:8px 12px;font-size:13px;font-weight:650}
.theme-toggle:hover{border-color:var(--accent)}.theme-switch{position:relative;width:36px;height:20px;border-radius:30px;background:#71618e;display:inline-block}

html[data-theme=light]{color-scheme:light;--bg:#f6f4fa;--side:#fff;--surface:#fff;--surface2:#f0ebf9;--border:#e5dff0;--text:#231d32;--muted:#6e677b;--accent:#7251bc;--input:#faf9fd}

html[data-theme=light] .mobile-nav button{color:#5e536d}html[data-theme=light] .mobile-nav button.active{color:#714ec2}

 if(!cloudUser)return;const account=cloudUser.id,epoch=authEpoch,originView=view,originSelected=selected,originTab=tab,previous=document.activeElement;

 el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}if(e.key==='Tab'){const nodes=[...form.querySelectorAll('input,textarea,select,button')].filter(n=>!n.disabled&&!n.hidden),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function pos70EditEntry(type,id){const p=project(),t=p?.[type]?.find(x=>x.id===id);if(!t)return;const original=JSON.stringify([t.text,t.priority,t.due]);const priorities=['critical','high','medium','low'];
 pos70Dialog({title:type==='tasks'?'Edit task':'Edit item',body:`<div class="field"><label for="pos70-text">${type==='tasks'?'Task description':'Item or purchase'}</label><textarea id="pos70-text" name="text" required>${esc(t.text)}</textarea></div><div class="field"><label for="pos70-priority">Priority</label><select id="pos70-priority" name="priority">${priorities.map(v=>`<option value="${v}" ${v===(t.priority||'medium')?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div><div class="field"><label for="pos70-due">${type==='tasks'?'Due date':'Needed by'} (optional)</label><input type="date" id="pos70-due" name="due" value="${esc(t.due||'')}"><span class="small muted">Leave blank for no date.</span></div>`,guard:()=>project()===p&&p[type].includes(t)&&JSON.stringify([t.text,t.priority,t.due])===original,commit:data=>{const text=String(data.get('text')).trim(),priority=String(data.get('priority')),due=String(data.get('due'));if(!text||!priorities.includes(priority)||due&&!validISODate(due))throw Error('Enter a description, valid priority and valid date.');t.text=text;t.priority=priority;t.due=due;save();render();pos69Notice('Changes applied.','success')}})

function decision(){const p=project();if(!p)return;pos70Dialog({title:'Record a decision',body:'<div class="field"><label for="pos70-decision">What did you decide?</label><textarea id="pos70-decision" name="decision" required></textarea></div><div class="field"><label for="pos70-why">Why? (optional)</label><textarea id="pos70-why" name="why" placeholder="Evidence, assumptions and tradeoffs"></textarea></div>',submit:'Record decision',guard:()=>project()===p,commit:data=>{const d=String(data.get('decision')).trim();if(!d)throw Error('Enter a decision.');p.decisions.unshift({id:uid(),decision:d,why:String(data.get('why')).trim(),date:new Date().toLocaleDateString()});save();render()}})}function money(n){return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2})}function numericCost(v){return typeof v==='number'&&Number.isFinite(v)&&v>=0?v:null}function budgetAmount(p){const v=String(p.budget||'').trim();const m=v.match(/^(?:\$\s*)?([\d,]+(?:\.\d{1,2})?)\s*(?:USD)?$/i)||v.match(/\$\s*([\d,]+(?:\.\d{1,2})?)/);return m?numericCost(Number(m[1].replace(/,/g,''))):null}function costSummary(p){const items=p.items||[],known=items.filter(i=>itemTotal(i)!==null),total=known.reduce((a,i)=>a+itemTotal(i),0),budget=budgetAmount(p),missing=items.length-known.length;return `<div class="panel"><h2>Estimated project cost</h2><div class="stat" style="color:var(--text)">${known.length||!items.length?'~'+money(total):'Not priced'}${budget!==null?' / '+money(budget):''}</div><p class="muted small">${missing?missing+' item(s) without prices · total is incomplete':'All listed items included'} · Estimates, not live quotes</p>${budget!==null&&budget>0?`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,total/budget*100)}%;background:${total>budget?'#dc2626':'#16834a'}"></div></div><p class="muted small">${money(Math.abs(budget-total))} ${total>budget?'over budget':'remaining before unpriced items'}</p>`:''}</div>`}
// v47: personal project milestones; independent checkpoints stored in project_data.
function mile47Rows(p){return (Array.isArray(p?.milestones)?p.milestones:[]).filter(m=>m&&typeof m.id==='string'&&typeof m.title==='string'&&m.title.trim());}
function mile47Facts(p){const rows=mile47Rows(p),open=rows.filter(m=>!m.done),today=dateToday();return {total:rows.length,completed:rows.length-open.length,overdue:open.filter(m=>validISODate(m.due)&&m.due<today).length,unscheduled:open.filter(m=>!validISODate(m.due)).length};}
function mile47Panel(p){const rows=mile47Rows(p),f=mile47Facts(p),locked=p.status==='Archived';const order=rows.map((m,i)=>({m,i})).sort((a,b)=>Number(!!a.m.done)-Number(!!b.m.done)||String(a.m.due||'9999').localeCompare(String(b.m.due||'9999')));return `<section class="panel mile47-panel"><div class="row between"><h2>Milestones</h2>${locked?'':`<button type="button" class="btn secondary" onclick="mile47Edit(-1)">+ Milestone</button>`}</div><p class="muted small">Track meaningful achievements, not just completed tasks. Milestones are marked achieved manually and do not change task progress.</p>${rows.length?`<div class="mile47-progress"><progress value="${f.completed}" max="${f.total}" aria-label="Milestone progress"></progress><span class="small">${f.completed} / ${f.total} achieved${f.overdue?' · '+f.overdue+' overdue':''}</span></div>${order.map(({m,i})=>`<div class="mile47-entry"><span class="mile47-mark ${m.done?'achieved':''}" aria-hidden="true">${m.done?'✓':'◇'}</span><div class="mile47-text"><strong class="${m.done?'done':''}">${esc(m.title)}</strong><span class="small ${!m.done&&validISODate(m.due)&&m.due<dateToday()?'late':'muted'}">${m.done?'Achieved · ':''}${validISODate(m.due)?esc(m.due):'No target date'}</span>${m.criteria?`<p class="small">${esc(m.criteria)}</p>`:''}</div>${locked?'':`<div class="mile47-actions"><button class="btn secondary mini" onclick="mile47Toggle(${i})">${m.done?'Reopen':'Mark achieved'}</button><button class="btn ghost mini" onclick="mile47Edit(${i})">Edit</button></div>`}</div>`).join('')}`:'<p class="muted small">No milestones yet. Add a checkpoint such as a venue booking, finished prototype or launch.</p>'}</section>`;}
function mile47Writable(p){return !!(p&&cloudUser?.id&&cloudReady&&p.status!=='Archived');}
function mile47Record(p,event){p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event});save();render();}
function mile47Toggle(i){const p=project(),m=mile47Rows(p)[i];if(!mile47Writable(p)||!m)return;m.done=!m.done;m.completedAt=m.done?new Date().toISOString():null;mile47Record(p,(m.done?'Achieved':'Reopened')+' milestone: '+m.title);}
function mile47Edit(i){const p=project(),rows=mile47Rows(p),m=rows[i],account=cloudUser?.id,epoch=authEpoch;if(!mile47Writable(p)||(i>=0&&!m))return;if(i<0&&rows.length>=50){pos69Notice('A project can have up to 50 milestones.','warning');return}document.getElementById('mile47-modal')?.remove();const el=document.createElement('div');el.id='mile47-modal';el.className='modal-backdrop';el.style.zIndex='100';const snapshot=m?JSON.stringify(m):null;el.innerHTML=`<form class="modal-dialog stack" role="dialog" aria-modal="true" aria-labelledby="mile47-title"><div class="row between"><h2 id="mile47-title">${m?'Edit milestone':'New milestone'}</h2><button type="button" class="btn ghost mini" data-close aria-label="Close">×</button></div><div class="field"><label for="mile47-name">Milestone name</label><input id="mile47-name" maxlength="160" required value="${esc(m?.title||'')}" placeholder="e.g. Venue confirmed"></div><div class="field"><label for="mile47-date">Target date (optional)</label><input type="date" id="mile47-date" value="${esc(m?.due||'')}"><span class="muted small">Dated milestones appear in Schedule.</span></div><div class="field"><label for="mile47-criteria">What counts as achieved? (optional)</label><textarea id="mile47-criteria" maxlength="1200" placeholder="Describe the outcome or evidence you want to see.">${esc(m?.criteria||'')}</textarea></div><p class="small late" data-error role="alert"></p><div class="row between"><button type="submit" class="btn">Save milestone</button>${m?'<button type="button" class="btn danger" data-remove>Remove milestone</button>':''}</div></form>`;const q=x=>el.querySelector(x),close=()=>el.remove(),err=msg=>q('[data-error]').textContent=msg;function current(){const pr=project();if(cloudUser?.id!==account||authEpoch!==epoch||pr?.id!==p.id||!mile47Writable(pr)){close();return null}const list=mile47Rows(pr),item=m?list.find(x=>x.id===m.id):null;if(m&&(!item||JSON.stringify(item)!==snapshot)){err('This milestone changed. Close and function overviewMetrics(p){return `<div class="cards"><div class="panel"><h2>Overall task progress</h2><div class="stat">${p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0}%</div>${progressMarkup(p)}</div>${costSummary(p)}</div>`}function itemQty(i){return Number.isSafeInteger(i?.quantity)&&i.quantity>0?i.quantity:1}

function itemTotal(i){const u=itemUnit(i);return u===null?null:Math.round(u*itemQty(i)*100)/100}

function budgetEditor(p){const f=financeData(p),t=financeTotals(p),b=budgetAmount(p);return `<div class="stack"><div class="panel"><h2>Financial overview</h2><div class="field"><label>Project budget (USD, optional)</label><input type="number" min="0" step="0.01" value="${b??''}" onchange="setFinanceBudget(this.value)"></div><div class="cards">${[['Actual spending',money(t.spent)],['Remaining funds',b===null?'No budget':money(b-t.spent)],['Allocated',money(t.allocated)],['Forecast total',money(t.forecast)]].map(([l,v])=>`<div class="card"><div class="muted small">${l}</div><div class="stat">${v}</div></div>`).join('')}</div><p class="muted small">Forecast = recorded expenses + estimates for items without linked expenses. Purchased checkboxes alone do not record spending. Unpriced items are excluded.</p>${b!==null&&t.forecast>b?'<p class="late">Forecast exceeds budget.</p>':''}${b!==null&&t.allocated>b?'<p class="late">Allocations exceed budget.</p>':''}</div><div class="panel"><div class="row between"><h2>Allocations</h2>${btn('+ Allocation',"editFinance('allocations',-1)",'')}</div>${f.allocations.map((e,n)=>`<div class="item"><div class="grow">${esc(e.name)}<div class="muted small">Spent: ${money(f.expenses.filter(x=>x.categoryId===e.id).reduce((a,x)=>a+x.amount,0))}</div></div><strong>${money(e.amount)}</strong>${btn('Edit',`editFinance('allocations',${n})`,'ghost mini')}${btn('Remove',`removeFinance('allocations',${n})`,'ghost mini')}</div>`).join('')||'<p class="muted">No allocations yet.</p>'}</div><div class="panel"><div class="row between"><h2>Expenses</h2>${btn('+ Expense',"editFinance('expenses',-1)",'')}</div>${f.expenses.map((e,n)=>`<div class="item"><div class="grow">${esc(e.name)}<div class="muted small">${esc(e.date||'')} · ${esc(f.allocations.find(x=>x.id===e.categoryId)?.name||'Uncategorized')}${e.itemId?' · Linked item':''}</div></div><strong>${money(e.amount)}</strong>${btn('Edit',`editFinance('expenses',${n})`,'ghost mini')}${btn('Remove',`removeFinance('expenses',${n})`,'ghost mini')}</div>`).join('')||'<p class="muted">No expenses recorded.</p>'}</div>${costSummary(p)}${btn('Manage items',"tab='items';render()")}</div>`}
function setFinanceBudget(v){if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0)){pos69Notice('Enter a nonnegative budget.','warning');render();return}setField('budget',v);render()}
function removeFinance(k,n){const f=financeData(project());if(!confirm('Remove this entry?'))return;const e=f[k][n];if(k==='allocations')f.expenses.forEach(x=>{if(x.categoryId===e.id)x.categoryId=''});f[k].splice(n,1);save();render()}
function editFinance(k,n){const p=project(),f=financeData(p),e=f[k][n]||{},expense=k==='expenses',o=document.createElement('div');o.className='modal-backdrop';o.innerHTML=`<div class="modal-dialog" role="dialog" aria-modal="true"><h2>${n<0?'Add':'Edit'} ${expense?'expense':'allocation'}</h2><form><div class="field"><label>Name<input name="name" required maxlength="200" value="${esc(e.name||'')}"></label></div><div class="field"><label>Amount (USD)<input name="amount" type="number" min="0" max="999999999" step="0.01" required value="${e.amount??''}"></label></div>${expense?`<div class="field"><label>Date<input name="date" type="date" required value="${esc(e.date||dateToday())}"></label></div><div class="field"><label>Allocation<select name="categoryId"><option value="">Uncategorized</option>${f.allocations.map(x=>`<option value="${esc(x.id)}" ${e.categoryId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><div class="field"><label>Linked item (optional)<select name="itemId"><option value="">None</option>${p.items.map(x=>`<option value="${esc(x.id)}" ${e.itemId===x.id?'selected':''}>${esc(x.text)}</option>`).join('')}</select></label><p class="muted small">Link only when the expense covers the item's full estimated purchase. Linked items are excluded from remaining estimates.</p></div>`:''}<div class="row"><button class="btn" type="submit">Save</button><button class="btn secondary" type="button" data-cancel>Cancel</button></div></form></div>`;document.body.append(o);o.querySelector('[data-cancel]').onclick=()=>o.remove();o.querySelector('form').onsubmit=ev=>{ev.preventDefault();const d=new FormData(ev.target),name=String(d.get('name')).trim(),amount=Number(d.get('amount'));if(!name||!Number.isFinite(amount)||amount<0)return;const x={id:e.id||uid(),name,amount};if(expense)Object.assign(x,{date:d.get('date'),categoryId:d.get('categoryId'),itemId:d.get('itemId')});if(n<0)f[k].push(x);else f[k][n]=x;save();o.remove();render()}}

}

 if(!active())return;
 const result=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(!Array.isArray(result.tasks))throw Error('Invalid task proposal response.');

}

/* v45: personal task dependencies (project-data metadata, not server-side enforcement). */
function dep45Ids(p,t){return [...new Set(Array.isArray(t?.dependsOn)?t.dependsOn.filter(x=>typeof x==='string'):[])];}
function dep45Pending(p,t){if(!p||!t)return [];return dep45Ids(p,t).map(id=>{const x=(p.tasks||[]).find(a=>a.id===id);return {id,title:x?.text||'Archived or unavailable task',missing:!x,done:!!(x&&(x.done||x.status==='completed'))}}).filter(x=>!x.done)}
function dep45Cycle(p,id,ids){const map=new Map((p.tasks||[]).map(t=>[t.id,dep45Ids(p,t)]));map.set(id,ids);const seen=new Set(),active=new Set();function visit(k){if(active.has(k))return true;if(seen.has(k))return false;active.add(k);for(const n of map.get(k)||[])if(visit(n))return true;active.delete(k);seen.add(k);return false}return visit(id)}
function dep45Label(p,t){const pending=dep45Pending(p,t);return pending.length?`<div class="dep45-wait"><strong>Waiting on ${pending.length} prerequisite${pending.length===1?'':'s'}</strong><span>${esc(pending.map(x=>x.title).join(' · '))}</span></div>`:dep45Ids(p,t).length?'<div class="muted small">Prerequisites complete</div>':''}
function dep45Edit(i){const p=project(),t=p?.tasks?.[i],account=cloudUser?.id,epoch=authEpoch;if(!p||!t||!account||!cloudReady||p.status==='Archived')return;document.getElementById('dep45-modal')?.remove();const el=document.createElement('div');el.id='dep45-modal';el.className='modal-backdrop';el.style.zIndex='100';const initial=dep45Ids(p,t),candidates=p.tasks.filter(x=>x.id!==t.id);const missing=initial.filter(id=>!candidates.some(x=>x.id===id));el.innerHTML=`<form class="modal-dialog stack" role="dialog" aria-modal="true" aria-label="Task dependencies"><div class="row between"><h2>Task dependencies</h2><button type="button" class="btn ghost mini" data-close aria-label="Close">×</button></div><strong>${esc(t.text)}</strong><p class="muted small">Choose the tasks that must finish first. An archived prerequisite stays unresolved until you remove its link. Applies to your personal project interface.</p><div data-options class="dep45-options"></div><p data-error role="alert" class="small"></p><button type="submit" class="btn">Save dependencies</button></form>`;const host=el.querySelector('[data-options]');for(const x of [...candidates,...missing.map(id=>({id,text:'Archived or unavailable task'}))]){const label=document.createElement('label');label.className='dep45-choice';const input=document.createElement('input');input.type='checkbox';input.value=x.id;input.checked=initial.includes(x.id);const name=document.createElement('span');name.textContent=x.text+(x.done?' · Complete':'');label.append(input,name);host.append(label)}if(!host.children.length)host.textContent='Add another task to create a dependency.';const close=()=>el.remove();el.querySelector('[data-close]').onclick=close;el.onclick=e=>{if(e.target===el)close()};el.addEventListener('keydown',e=>{if(e.key==='Escape')close()});el.querySelector('form').onsubmit=e=>{e.preventDefault();const current=project(),task=current?.tasks.find(x=>x.id===t.id),err=el.querySelector('[data-error]');if(cloudUser?.id!==account||authEpoch!==epoch||current?.id!==p.id||!task||!cloudReady||current.status==='Archived'){close();return}const ids=[...host.querySelectorAll('input:checked')].map(x=>x.value);if(dep45Cycle(current,task.id,ids)){err.textContent='This would create a circular dependency. Choose a different prerequisite.';return}task.dependsOn=ids;save();close();render()};document.body.append(el);el.querySelector('[data-close]').focus()}
function sub46Rows(t){return Array.isArray(t?.subtasks)?t.subtasks.filter(x=>x&&typeof x.id==='string'&&typeof x.text==='string'&&x.text.trim()).map(x=>({id:x.id,text:x.text,done:!!x.done})):[]}
function sub46Pending(t){return sub46Rows(t).filter(x=>!x.done).length}
function sub46Label(t){const rows=sub46Rows(t);if(!rows.length)return '';const n=rows.filter(x=>x.done).length;return `<div class="sub46-progress"><span class="muted small">Subtasks · ${n} / ${rows.length} complete</span><progress aria-label="Subtask progress" value="${n}" max="${rows.length}"></progress></div>`}
function sub46Edit(i){const p=project(),t=p?.tasks?.[i],account=cloudUser?.id,epoch=authEpoch;if(!p||!t||!account||!cloudReady||p.status==='Archived')return;document.getElementById('sub46-modal')?.remove();const el=document.createElement('div');el.id='sub46-modal';el.className='modal-backdrop';el.style.zIndex='100';const initial=JSON.stringify(sub46Rows(t));let rows=sub46Rows(t);const locked=!!(t.done||t.status==='submitted'||(t.assignedTo&&t.assignedTo!==account));el.innerHTML=`<form class="modal-dialog stack sub46-dialog" role="dialog" aria-modal="true" aria-label="Subtasks"><div class="row between"><h2>Subtasks</h2><button type="button" class="btn ghost mini" data-close aria-label="Close">×</button></div><strong>${esc(t.text)}</strong><p class="muted small">${locked?'This checklist is read-only for completed, submitted or delegated tasks.':'Break this task into smaller steps. Finish the checklist before completing the parent task.'}</p><div data-list class="sub46-list"></div>${locked?'':`<div class="row sub46-add"><input data-new aria-label="New subtask" placeholder="Add a subtask…" maxlength="200"><button type="button" class="btn secondary" data-add>Add</button></div><p class="muted small" data-count></p><p data-error role="alert" class="small"></p><button type="submit" class="btn">Save checklist</button>`}</form>`;const q=x=>el.querySelector(x),host=q('[data-list]');function draw(){host.replaceChildren();if(!rows.length)host.textContent='No subtasks yet.';for(const row of rows){const wrap=document.createElement('div');wrap.className='sub46-line';const check=document.createElement('input');check.type='checkbox';check.checked=row.done;check.disabled=locked;check.setAttribute('aria-label','Complete '+row.text);const title=document.createElement('input');title.type='text';title.maxLength=200;title.value=row.text;title.readOnly=locked;title.setAttribute('aria-label','Subtask title');title.className=row.done?'done':'';check.onchange=()=>{row.done=check.checked;title.classList.toggle('done',row.done);count()};title.oninput=()=>{row.text=title.value};wrap.append(check,title);if(!locked){const remove=document.createElement('button');remove.type='button';remove.className='btn ghost mini';remove.textContent='×';remove.setAttribute('aria-label','Remove subtask');remove.onclick=()=>{rows=rows.filter(x=>x!==row);draw()};wrap.append(remove)}host.append(wrap)}count()}function count(){if(q('[data-count]'))q('[data-count]').textContent=rows.filter(x=>x.done).length+' of '+rows.length+' complete · Maximum 30 steps'}const close=()=>el.remove();q('[data-close]').onclick=close;el.onclick=e=>{if(e.target===el)close()};el.addEventListener('keydown',e=>{if(e.key==='Escape')close()});if(!locked){function add(){const input=q('[data-new]'),text=input.value.trim();if(!text)return;if(rows.length>=30){q('[data-error]').textContent='Maximum 30 subtasks per task.';return}rows.push({id:uid(),text,done:false});input.value='';q('[data-error]').textContent='';draw();input.focus()}q('[data-add]').onclick=add;q('[data-new]').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};q('form').onsubmit=e=>{e.preventDefault();const current=project(),task=current?.tasks.find(x=>x.id===t.id),err=q('[data-error]');if(cloudUser?.id!==account||authEpoch!==epoch||current?.id!==p.id||!task||!cloudReady||current.status==='Archived'){close();return}if(task.done||task.status==='submitted'||(task.assignedTo&&task.assignedTo!==account)||JSON.stringify(sub46Rows(task))!==initial){err.textContent='This task changed. Close and reopen its checklist.';return}if(q('[data-new]').value.trim()){err.textContent='Add your new step before saving.';return}if(rows.some(x=>!x.text.trim())){err.textContent='Enter a title for every step or remove it.';return}task.subtasks=rows.map(x=>({...x,text:x.text.trim()}));save();close();render()}}else q('form').onsubmit=e=>e.preventDefault();draw();document.body.append(el);q('[data-close]').focus()}
function dep45Guard(p,t){if(sub46Pending(t)){alert("Finish the task checklist first ("+sub46Pending(t)+" unfinished). Open the task’s Subtasks button.");return false}const pending=dep45Pending(p,t);if(!pending.length)return true;alert('Finish or remove these prerequisites first: '+pending.map(x=>x.title).join(', '));return false}
