/* v1.2: responsive appearance system */
:root{color-scheme:dark;--bg:#0b0a11;--side:#11101a;--surface:#191723;--surface2:#242131;--border:#353044;--text:#f3effb;--muted:#aaa4bb;--accent:#b8a1ff;--input:#12101b}
body{background:var(--bg);color:var(--text);transition:background .22s,color .22s}
.sidebar,.mobile-nav{background:var(--side);border-color:var(--border)}
.card,.panel{background:var(--surface);border-color:var(--border);border-radius:21px;box-shadow:0 9px 30px rgba(0,0,0,.07)}
.project-card:hover{border-color:var(--accent);box-shadow:0 12px 35px rgba(145,105,250,.14)}
.nav button{color:var(--muted)}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text)}
.muted,.footer{color:var(--muted)}.secondary,.tabs button{background:var(--surface2);color:var(--text)}
.ghost{color:var(--text);border-color:var(--border)}.pill{background:var(--surface2);color:var(--accent)}
input,textarea,select{background:var(--input);color:var(--text);border-color:var(--border)}
.field label{color:var(--muted)}.item{border-color:var(--border)}.empty{border-color:var(--border);color:var(--muted)}
.btn{border-radius:12px}.top{padding-bottom:12px;border-bottom:1px solid var(--border)}
.theme-toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:100px;padding:8px 12px;font-size:13px;font-weight:650}
.theme-toggle:hover{border-color:var(--accent)}.theme-switch{position:relative;width:36px;height:20px;border-radius:30px;background:#71618e;display:inline-block}
.theme-switch:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:white;border-radius:50%;transition:transform .2s}
html[data-theme=light]{color-scheme:light;--bg:#f6f4fa;--side:#fff;--surface:#fff;--surface2:#f0ebf9;--border:#e5dff0;--text:#231d32;--muted:#6e677b;--accent:#7251bc;--input:#faf9fd}

html[data-theme=light] .prompt{background:#faf8ff;border-color:var(--border)}

html[data-theme=light] .mobile-nav button{color:#5e536d}html[data-theme=light] .mobile-nav button.active{color:#714ec2}

@media(max-width:750px){.theme-toggle{padding:7px 9px}.theme-label{display:none}.top{gap:10px}}
@media print{body{background:white!important;color:black!important}.card,.panel{background:white!important;color:black!important}}

function btn(label,fn,cl='secondary'){return `<button class="btn ${cl}" onclick="${fn}">${label}</button>`}function nav(){let n=[['home','⌂','Home'],['projects','▣','Projects'],['tasks','☑','Tasks'],['shared','♧','Shared'],['lists','☷','Lists'],['archive','▤','Archive'],['profile','♙','My Profile'],['settings','⚙','Settings']];return `<aside class="sidebar"><div class="brand">PROJECT <span>OS</span></div><div class="nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div></aside><nav class="mobile-nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><div style="font-size:19px">${x[1]}</div>${x[2]}</button>`).join('')}</nav>`}const THEME_KEY='project-os-theme';let currentTheme=localStorage.getItem(THEME_KEY)||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');function applyTheme(){document.documentElement.dataset.theme=currentTheme;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',currentTheme==='light'?'#f3f7fc':'#0b0a11')}function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,currentTheme);applyTheme();render()}function themeButton(){return `<button class="theme-toggle no-print" onclick="toggleTheme()" aria-label="Switch to ${currentTheme==='dark'?'light':'dark'} mode" title="Toggle light and dark mode"><span>${currentTheme==='dark'?'☾':'☀'}</span><span class="theme-label">${currentTheme==='dark'?'Dark':'Light'}</span><span class="theme-switch" aria-hidden="true"></span></button>`}applyTheme();function shell(title,actions,content){$('#app').innerHTML=`<div class="shell">${nav()}<main class="main"><div class="top"><h1 class="${view==='home'?'editorial-title':''}">${title}</h1><div class="row no-print">${actions||''}${themeButton()}</div></div>${content}<div class="footer">Project OS · <span id="cloud-state">Cloud account</span> · Export backups regularly.</div></main></div>`}const DEFAULT_SECTIONS=['Work','Personal'];let sectionFilter='all';function sections(){return [...new Set([...DEFAULT_SECTIONS,...(db.sections||[]),...db.projects.map(p=>p.section||'Uncategorized')])]}function sectionOptions(current){return sections().map(x=>`<option value="${esc(x)}" ${current===x?'selected':''}>${esc(x)}</option>`).join('')}function chooseSection(){let available=sections();let choice=prompt('Which section does this project belong to?\n\nExisting sections: '+available.join(', ')+'\n\nEnter an existing section or a new name:','Personal');if(choice===null)return null;choice=choice.trim();if(!choice){alert('Please enter a section name.');return null}if(choice.length>60){alert('Section names must be 60 characters or fewer.');return null}let existing=available.find(x=>x.toLowerCase()===choice.toLowerCase());choice=existing||choice;db.sections||=[];if(!db.sections.includes(choice))db.sections.push(choice);return choice}function setProjectSection(v){const p=project();if(!p)return;p.section=v;save();render()}function manageSections(){let name=prompt('Add a section (e.g. School, Music, Family):');if(name===null)return;name=name.trim();if(!name||name.length>60){alert('Enter a section name of up to 60 characters.');return}if(sections().some(x=>x.toLowerCase()===name.toLowerCase())){alert('That section already exists.');return}db.sections||=[];db.sections.push(name);save();render()}function setSectionFilter(v){sectionFilter=v;render()}function sectionPicker(){return `<div class="row no-print" style="margin:0 0 16px"><label class="muted small">Section <select style="width:auto;min-width:150px" onchange="setSectionFilter(this.value)"><option value="all">All sections</option>${sections().map(x=>`<option value="${esc(x)}" ${sectionFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>${btn('+ Add section','manageSections()','ghost mini')}</div>`}function inSection(p){return sectionFilter==='all'||(p.section||'Uncategorized')===sectionFilter}function sectionTag(p){return `<span class="pill" style="background:#263b46;color:#bce5ec">${esc(p.section||'Uncategorized')}</span>`}function summary(){let tasks=db.projects.flatMap(p=>p.tasks||[]);return {projects:db.projects.length,open:tasks.filter(t=>!t.done).length,done:tasks.filter(t=>t.done).length,items:db.projects.flatMap(p=>p.items||[]).filter(i=>!i.done).length}}function projCard(p){let all=p.tasks.length,done=p.tasks.filter(t=>t.done).length;return `<div class="card project-card" onclick="openProject('${p.id}')"><div class="row between"><span class="pill">${esc(p.status)}</span>${sectionTag(p)}<span class="muted small">${all?Math.round(done/all*100):0}%</span></div><h2 style="margin:17px 0 7px">${esc(p.name)}</h2><p class="muted small">${esc(p.description||'No description yet')}</p>${progressMarkup(p)}<button class="card-edit no-print" title="Edit project" aria-label="Edit ${esc(p.name)}" onclick="event.stopPropagation();editProjectMenu('${p.id}')">✎</button></div>`}function home(){
 const s=summary(),active=db.projects.filter(p=>!['Archived','Completed'].includes(p.status)&&inSection(p));
 const pending=db.projects.filter(inSection).flatMap(p=>(p.tasks||[]).filter(t=>!t.done).map(t=>({...t,projectId:p.id,projectName:p.name})));
 const rank={critical:4,high:3,medium:2,low:1},due=t=>t.due?new Date(t.due+'T12:00:00').getTime():Infinity;
 pending.sort((a,b)=>due(a)-due(b)||(rank[b.priority]||2)-(rank[a.priority]||2));
 const today=new Date();today.setHours(0,0,0,0);
 const taskRows=pending.slice(0,8).map(t=>{const overdue=t.due&&due(t)<today.getTime();return `<div class="item"><span style="color:${overdue?'#fda4af':'#b8a8ff'}">${overdue?'!':'○'}</span><div class="grow"><strong>${esc(t.text)}</strong><div class="muted small">${esc(t.projectName)} · ${t.due?(overdue?'Overdue: ':'Due: ')+esc(t.due):'No due date'} · ${esc(t.priority||'medium')} priority</div></div>${btn('View',`openProject('${t.projectId}');tab='tasks';render()`,'ghost mini')}</div>`}).join('');
 shell('Welcome to Project OS','',`${sectionPicker()}<p class="muted">What would you like to work on?</p><div class="project-grid" style="margin:20px 0 26px"><div class="card" style="border-color:#7864c7"><h2>✦ Start a new project</h2><p class="muted small">Begin with a conversation. Your AI consultant will help shape the idea and fill in the project details.</p>${btn('Start with AI Consultant','createProject()','')}</div><div class="card"><h2>▣ Your projects</h2><p class="muted small">Continue planning, review progress, or revisit your project archive.</p>${btn('View projects',"go('projects')",'secondary')}</div></div><div class="cards"><div class="card"><div class="muted small">Active projects</div><div class="stat">${active.length}</div></div><div class="card"><div class="muted small">Open tasks</div><div class="stat">${s.open}</div></div><div class="card"><div class="muted small">Completed tasks</div><div class="stat">${s.done}</div></div><div class="card"><div class="muted small">Unchecked items</div><div class="stat">${s.items}</div></div></div><div class="row between" style="margin:8px 0 14px"><h2 style="margin:0">Upcoming tasks</h2>${btn('All tasks',"go('tasks')",'ghost mini')}</div>${pending.length?`<div class="panel">${taskRows}</div>`:'<div class="empty">No outstanding tasks yet. Start a project to generate your first plan.</div>'}<div class="row between" style="margin:25px 0 14px"><h2 style="margin:0">Recent projects</h2>${btn('View all',"go('projects')",'ghost mini')}</div>${active.length?`<div class="project-grid">${active.slice(0,4).map(projCard).join('')}</div>`:'<div class="empty">No active projects. Your next idea starts here.</div>'}`)
}
function projects(){let visible=db.projects.filter(p=>p.status!=='Archived'&&inSection(p));shell('Projects',btn('+ New project','createProject()',''),sectionPicker()+(visible.length?`<div class="project-grid">${visible.map(projCard).join('')}</div>`:`<div class="empty">No projects in this section yet.</div>`))}function dateToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function localClockContext(){const d=new Date();return `CURRENT LOCAL DATE: ${dateToday()}. CURRENT LOCAL TIME: ${d.toLocaleString()}. IANA TIME ZONE: ${Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'}. Today's date is authoritative, not any date inferred from training data. Never propose new dates before today unless the user explicitly requests a retrospective/historical plan. Past existing deadlines are historical/overdue, not future recommendations. If a requested deadline is past, explain it and ask whether to reschedule or create a recovery plan. If the deadline is open-ended, do not invent one; suggest undated next steps or ask whether the user wants a target. When you ask the user for a deadline, tell them to use the project's calendar date picker or choose To be decided / Open-ended.`}
function validISODate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return false;const d=new Date(s+'T12:00:00');return !Number.isNaN(d.getTime())&&`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===s}
function datePickerMarkup(id,value='',allowOpen=true){return `<div class="field"><label for="${id}">Choose a date</label><input type="date" id="${id}" value="${esc(value)}" ${allowOpen&&!value?'disabled':''}></div>${allowOpen?`<label class="date-open-option"><input type="checkbox" id="${id}-open" ${value?'':'checked'} onchange="document.getElementById('${id}').disabled=this.checked;if(this.checked)document.getElementById('${id}').value=''"> To be decided / Open-ended</label>`:''}`}
function datePickerValue(id){const open=document.getElementById(id+'-open');if(open?.checked)return '';const v=document.getElementById(id)?.value||'';if(!validISODate(v)){alert('Choose a valid date, or select To be decided / Open-ended.');return null}return v}
function createProject(){
 const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='project-date-modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};

function toggleNewProjectSection(value){const wrap=document.getElementById('new-project-section-wrap');if(wrap)wrap.style.display=value==='__new__'?'block':'none';if(value==='__new__')document.getElementById('new-project-section-name')?.focus()}

 if(section==='__new__'){section=(document.getElementById('new-project-section-name')?.value||'').trim();if(!section||section.length>60){alert('Enter a section name (up to 60 characters).');return}section=sections().find(x=>x.toLowerCase()===section.toLowerCase())||section;db.sections||=[];if(!db.sections.includes(section))db.sections.push(section)}
 const deadline=datePickerValue('new-project-date');if(deadline===null)return;
 const p={id:uid(),name:'Untitled project',section,description:'',status:'In progress',goal:'',success:'',audience:'',budget:'',deadline,deadlineType:'target',tasks:[],items:[],notes:'',phases:{},decisions:[],created:new Date().toISOString(),nameAutoDecided:false};
 db.projects.unshift(p);save();document.getElementById('project-date-modal')?.remove();selected=p.id;view='project';tab='consultant';render();setTimeout(()=>document.getElementById('consultant-message')?.focus(),0)
}
function setProjectDeadline(value){const p=project();if(!p)return;if(value&&!validISODate(value))return;p.deadline=value;save()}

function editProjectMenu(id){

 document.body.appendChild(overlay);overlay.querySelector('input')?.focus();

function closeProjectMenu(){document.getElementById('project-edit-modal')?.remove()}
function saveProjectMenu(id){const p=db.projects.find(x=>x.id===id);if(!p)return;const name=document.getElementById('edit-project-name')?.value.trim();if(!name){alert('Enter a project name.');return}const status=p.status;const section=document.getElementById('edit-project-section').value;if(p.name!==name)p.nameManuallyEdited=true;p.name=name;p.section=section;if(p.status!==status){p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:'Status changed to '+status});p.status=status}save();closeProjectMenu();render()}
function archiveFromMenu(id){const p=db.projects.find(x=>x.id===id);if(!p)return;p.status=p.status==='Archived'?'In progress':'Archived';p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:p.status==='Archived'?'Project archived':'Project restored from archive'});save();closeProjectMenu();render()}

function deleteProject(id){const p=db.projects.find(x=>x.id===id);if(!p)return;if(!confirm('Permanently delete "'+p.name+'" and all its tasks, lists, notes, and AI conversation? This cannot be undone.'))return;db.projects=db.projects.filter(x=>x.id!==id);if(selected===id){selected=null;view='projects';tab='overview';}if(taskFilter===id)taskFilter='all';save();render();} 
function field(label,key,area=false){let p=project(),value=esc(p[key]||'');return `<div class="field"><label>${label}</label>${area?`<textarea oninput="setField('${key}',this.value)">${value}</textarea>`:`<input value="${value}" oninput="setField('${key}',this.value)">`}</div>`}function setField(k,v){project()[k]=v;save()}function changeStatus(v){const p=project();p.status=v;p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:'Status changed to '+v});save();render()}function phaseContent(){let p=project();return `<div class="notice">The Idea Loop is a structured reflection tool, not an AI chat. Use it to record reasoning, uncertainty, experiments, and lessons.</div><div class="steps">${phases.map((ph,i)=>`<div class="step"><h3>${i+1}. ${ph}</h3><p>${prompts[ph]}</p><textarea aria-label="${ph}" placeholder="Your reasoning, evidence, questions, or next experiment..." oninput="setPhase('${ph}',this.value)">${esc(p.phases[ph]||'')}</textarea></div>`).join('')}</div>`}function setPhase(ph,v){project().phases[ph]=v;save()}function checkItem(type,id,checked){let p=project(),x=p[type].find(x=>x.id===id);if(x){x.done=checked;if(type==='tasks'){x.completedAt=checked?new Date().toISOString():null;if(checked){x.completedBy=prompt('Completed by (optional):',x.completedBy||'')||'';let link=prompt('Deliverable URL, e.g. Google Drive share link (optional):',x.deliverable||'');if(link&&/^https:\/\//i.test(link))x.deliverable=link;else if(link)alert('Please use an https:// link.');}p.activity ||= [];p.activity.unshift({at:new Date().toISOString(),event:(checked?'Completed':'Reopened')+' task: '+x.text+(x.completedBy?' by '+x.completedBy:'')});}save();render()}}function addItem(type){let v=$('#new-'+type)?.value.trim();if(!v)return;const id=uid();project()[type].push({id,text:v,done:false,priority:'medium',due:'',created:new Date().toISOString()});save();render();if(type==='tasks')openEntryDatePicker(type,id)}function removeItem(type,id){project()[type]=project()[type].filter(x=>x.id!==id);save();render()}function taskMeta(t){return `${t.created?'Created '+esc(new Date(t.created).toLocaleDateString())+' · ':''}${t.due?'Due '+esc(t.due)+' · ':'No due date · '}${esc(t.priority||'medium')} priority${t.completedBy?' · by '+esc(t.completedBy):''}${t.completedAt?' · '+new Date(t.completedAt).toLocaleDateString():''}${t.deliverable?' · <a href="'+esc(t.deliverable)+'" target="_blank" rel="noopener noreferrer">Deliverable ↗</a>':''}`}
function openEntryDatePicker(type,id){const t=project()?.[type]?.find(x=>x.id===id);if(!t)return;document.getElementById('entry-date-modal')?.remove();const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='entry-date-modal';overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.innerHTML=`<div class="modal-dialog" role="dialog" aria-modal="true"><div class="row between"><h2>${type==='tasks'?'Task due date':'Item needed by'}</h2><button class="btn ghost mini" onclick="document.getElementById('entry-date-modal').remove()">✕</button></div><p class="muted small">${esc(t.text)}</p>${datePickerMarkup('entry-due-date',t.due||'')}<button class="btn" onclick="saveEntryDate('${type}','${id}')">Save date</button></div>`;document.body.appendChild(overlay);if(!t.due)document.getElementById('entry-due-date').disabled=true}
function saveEntryDate(type,id){const due=datePickerValue('entry-due-date');if(due===null)return;const t=project()?.[type]?.find(x=>x.id===id);if(t)t.due=due;save();document.getElementById('entry-date-modal')?.remove();render()}
function editTask(id){let t=project().tasks.find(x=>x.id===id);if(!t)return;let text=prompt('Task description:',t.text);if(text===null)return;let priority=prompt('Priority: critical, high, medium, low',t.priority||'medium');if(priority===null)return;t.text=text.trim()||t.text;t.priority=['critical','high','medium','low'].includes(priority.toLowerCase())?priority.toLowerCase():'medium';save();openEntryDatePicker('tasks',id)}
function editListEntry(type,id){if(type==='tasks'){editTask(id);return;}let t=project().items.find(x=>x.id===id);if(!t)return;let text=prompt('Item or purchase:',t.text);if(text===null)return;let priority=prompt('Priority: critical, high, medium, low',t.priority||'medium');if(priority===null)return;t.text=text.trim()||t.text;t.priority=['critical','high','medium','low'].includes(priority.toLowerCase())?priority.toLowerCase():'medium';save();openEntryDatePicker(type,id)}
function listEditor(type,label){let p=project();return `<div class="panel"><h2>${label}</h2><div class="row no-print" style="margin-bottom:10px"><input style="flex:1" id="new-${type}" placeholder="Add ${type==='tasks'?'a task':'an item'}..." onkeydown="if(event.key==='Enter')addItem('${type}')">${btn('Add',`addItem('${type}')`,'')}</div>${p[type].length?p[type].map(x=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="checkItem('${type}','${x.id}',this.checked)"><div class="grow ${x.done?'done':''}">${esc(x.text)}<div class="muted small">${taskMeta(x)}</div></div><button class="mini ghost no-print" onclick="editListEntry('${type}','${x.id}')">Edit</button><button class="mini ghost no-print" onclick="removeItem('${type}','${x.id}')">Remove</button></div>`).join(''):`<div class="muted small">Nothing here yet.</div>`}</div>`}
function decision(){let d=prompt('What decision did you make?');if(!d?.trim())return;let why=prompt('Why? Include evidence, assumptions, and tradeoffs:')||'';project().decisions.unshift({id:uid(),decision:d,why,date:new Date().toLocaleDateString()});save();render()}function money(n){return '$'+n.toLocaleString('en-US',{maximumFractionDigits:2})}function numericCost(v){return typeof v==='number'&&Number.isFinite(v)&&v>=0?v:null}function budgetAmount(p){const v=String(p.budget||'').trim();const m=v.match(/^(?:\$\s*)?([\d,]+(?:\.\d{1,2})?)\s*(?:USD)?$/i)||v.match(/\$\s*([\d,]+(?:\.\d{1,2})?)/);return m?numericCost(Number(m[1].replace(/,/g,''))):null}function costSummary(p){const items=p.items||[],known=items.filter(i=>numericCost(i.estimatedCost)!==null),total=known.reduce((a,i)=>a+i.estimatedCost,0),budget=budgetAmount(p),missing=items.length-known.length;return `<div class="panel"><h2>Estimated project cost</h2><div class="stat" style="color:var(--text)">${known.length||!items.length?'~'+money(total):'Not priced'}${budget!==null?' / '+money(budget):''}</div><p class="muted small">${missing?missing+' item(s) without prices · total is incomplete':'All listed items included'} · Estimates, not live quotes</p>${budget!==null&&budget>0?`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,total/budget*100)}%;background:${total>budget?'#dc2626':'#16834a'}"></div></div><p class="muted small">${money(Math.abs(budget-total))} ${total>budget?'over budget':'remaining before unpriced items'}</p>`:''}</div>`}function overviewMetrics(p){return `<div class="cards"><div class="panel"><h2>Overall task progress</h2><div class="stat">${p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0}%</div>${progressMarkup(p)}</div>${costSummary(p)}</div>`}function setItemCost(id,value){const i=project().items.find(x=>x.id===id);if(!i)return;const n=value.trim()===''?null:numericCost(Number(value));if(n===null&&value.trim()!==''){alert('Enter a nonnegative cost.');render();return}i.estimatedCost=n;save();render()}function budgetEditor(p){return costSummary(p)+`<div class="panel"><div class="field"><label>Projected budget (USD, optional)</label><input type="number" min="0" step="0.01" value="${budgetAmount(p)??''}" onchange="setField('budget',this.value);render()"></div><h2>Item estimates</h2>${p.items.map(i=>`<div class="item"><div class="grow">${esc(i.text)}</div><input aria-label="Estimated total cost" type="number" min="0" step="0.01" placeholder="USD" style="width:125px" value="${numericCost(i.estimatedCost)??''}" onchange="setItemCost('${i.id}',this.value)"></div>`).join('')||'<p class="muted">Add items below or ask the Consultant.</p>'}</div>`}

// Retry transient Gemini/Worker failures without duplicating chat messages or project edits.
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function geminiRequest(messages,onRetry,mode="chat"){
 const delays=[1000,2500,5000];
 for(let attempt=0;;attempt++){
  try{
   if(!supa || !cloudUser)throw new Error('Please sign in to use the AI Consultant.');
   const {data:sessionData,error:sessionError}=await supa.auth.getSession();
   if(sessionError || !sessionData.session?.access_token)throw new Error('Your session expired. Please sign in again.');
   const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${sessionData.session.access_token}`},body:JSON.stringify({mode,messages:[{role:'user',content:localClockContext()},...messages]})});
   const data=await r.json().catch(()=>({}));
   if(!r.ok){const err=new Error((data.error||'Request failed')+(data.status?' (Gemini status '+data.status+')':''));err.status=r.status;err.code=data.code;err.providerStatus=Number(data.status)||null;throw err;}
   if(typeof data.reply!=='string'||!data.reply.trim())throw Error('No response from Gemini');
   return data.reply;
  }catch(e){
   const transient=[500,502,503,504].includes(e.status)||e instanceof TypeError;
   if(!transient||e.code||attempt>=delays.length)throw e;
   const seconds=Math.round(delays[attempt]/1000);
   onRetry?.(`AI service is temporarily unavailable. Retrying ${attempt+1} of ${delays.length} in about ${seconds} seconds…`);
   await wait(delays[attempt]);
  }
 }
}

  const updateStatus=$('#consultant-status');if(updateStatus)updateStatus.textContent='Consultation saved. Updating project details…';

async function initProjectOS(){
 if(!window.supabase?.createClient){showLogin('Could not load the Supabase library. Check your internet connection and refresh.');return}
 supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 // A recovery link signs the user in; keep the password form visible instead of loading the dashboard.
 const recoveryLink=location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('type')==='recovery';
 if(recoveryLink){passwordRecoveryMode=true;showSetPassword()}
 supa.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){passwordRecoveryMode=true;showSetPassword();return}
  if(event==='SIGNED_OUT'){passwordRecoveryMode=false;showLogin();return}
  if(passwordRecoveryMode||authScreenMode==='forgot')return;
  if(session?.user && (!cloudUser||cloudUser.id!==session.user.id))setTimeout(()=>{if(!passwordRecoveryMode)loadCloudWorkspace(session.user)},0)
 });
 const {data,error}=await supa.auth.getSession();
 if(error){if(passwordRecoveryMode)showSetPassword('This recovery link may have expired. Request a fresh link from the login page.');else showLogin(error.message);return}
 if(passwordRecoveryMode)return;
 if(data.session?.user)await loadCloudWorkspace(data.session.user);else showLogin();
}
async function loadCloudWorkspace(user){

 document.getElementById('app').innerHTML='<div class="auth-wrap"><div class="auth-card"><h2>Loading your private workspace…</h2><p class="muted">Connecting to Supabase.</p></div></div>';
 try{
  const [pr,st,profileResult]=await Promise.all([supa.from('projects').select('id,project_data').eq('owner_id',user.id),supa.from('user_settings').select('philosophy,philosophy_chat,preferences').eq('user_id',user.id).maybeSingle(),supa.from('user_profiles').select('*').eq('user_id',user.id).maybeSingle()]);
  if(pr.error)throw pr.error;if(st.error)throw st.error;if(profileResult.error)throw profileResult.error;osProfile=profileResult.data;
  const rows=pr.data||[];let imported=[];
  if(rows.length===0){let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
   if(Array.isArray(local?.projects)&&local.projects.length&&confirm('Your cloud account has no projects yet. Import '+local.projects.length+' project(s) from this browser into your private cloud account?\n\nChoose Cancel to start with an empty cloud workspace. Your original browser backup will remain untouched.'))imported=structuredClone(local.projects);
  }

  if(imported.length){db.projects=imported.map(p=>({...p,id:p.id||crypto.randomUUID()}));try{db.sections=JSON.parse(localStorage.getItem(KEY)||'{}').sections||[]}catch{}}
  philosophy=Array.isArray(st.data?.philosophy)?st.data.philosophy:structuredClone(defaultPrinciples);
  if(!st.data?.philosophy){try{const localP=JSON.parse(localStorage.getItem(PHILOSOPHY_KEY)||'null');if(Array.isArray(localP)&&confirm('Import your browser Philosophy Library into this cloud account?'))philosophy=localP}catch{}}
  cloudUser=user;await refreshOwnedTasks();cloudReady=true;view='home';selected=null;render();cloudStatus('Cloud connected');

function scheduleCloudSave(){if(!cloudUser||!cloudReady)return;cloudDirty=true;cloudStatus('Changes pending sync');clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloudSave,850)}
async function flushCloudSave(){
 if(!cloudUser||!cloudReady||cloudSaving)return;
 cloudSaving=true;clearTimeout(cloudTimer);
 try{
  while(cloudDirty&&cloudUser){
   cloudDirty=false;const userId=cloudUser.id;const projectsSnapshot=structuredClone(db.projects);const philosophySnapshot=structuredClone(philosophy);const sectionsSnapshot=structuredClone(db.sections||[]);const existing=new Map(cloudRows);
   cloudStatus('Syncing…');
   for(const p of projectsSnapshot){if(!cloudUser||cloudUser.id!==userId)throw Error('Account changed during sync');const rowId=existing.get(p.id)||crypto.randomUUID();const {error}=await supa.from('projects').upsert({id:rowId,owner_id:userId,name:p.name||'Untitled project',section:p.section||'Personal',status:p.status||'Planning',deadline:p.deadline||null,project_data:p,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;cloudRows.set(p.id,rowId);for(const t of p.tasks||[]){if(!t.serverId){await taskRpc('create_synced_task',{p_project_id:rowId,p_legacy_task_id:t.id,p_title:t.text,p_description:'',p_priority:t.priority||'medium',p_due_date:t.due||null});}}}
   const {error:se}=await supa.from('user_settings').upsert({user_id:userId,philosophy:philosophySnapshot,preferences:{sections:sectionsSnapshot},updated_at:new Date().toISOString()},{onConflict:'user_id'});if(se)throw se;
   const liveIds=new Set(db.projects.map(p=>p.id));for(const [projectId,rowId] of existing){if(!liveIds.has(projectId)){const {error}=await supa.from('projects').delete().eq('id',rowId).eq('owner_id',userId);if(error)throw error;cloudRows.delete(projectId)}}
   if(JSON.stringify(projectsSnapshot)!==JSON.stringify(db.projects)||JSON.stringify(philosophySnapshot)!==JSON.stringify(philosophy)||JSON.stringify(sectionsSnapshot)!==JSON.stringify(db.sections||[]))cloudDirty=true;
  }
  await refreshOwnedTasks();cloudStatus('All changes synced');if(view==='project'&&['tasks','checkin','team'].includes(tab))render();
 }catch(e){cloudDirty=true;cloudStatus('Sync failed: '+e.message,true);console.error('Cloud sync failed',e);}
 finally{cloudSaving=false;}
}

async function ensureProjectRow(p){if(!cloudRows.has(p.id)){await flushCloudSave();if(!cloudRows.has(p.id))throw Error('Project is not synced yet. Try Sync now.')}return cloudRows.get(p.id)}
function quickCheckTask(index,checked){const t=project()?.tasks[index];if(!t?.serverId){render();return}if(t.assignedTo&&t.assignedTo!==cloudUser.id){alert('Delegated tasks require review.');render();return}if(checked&&t.completionMethod==='deliverable'){render();ownerCompletion(t.serverId,false);return}if(checked&&t.completionMethod==='approval'&&!confirm('Confirm that you completed this task?')){render();return}collabAction(()=>checked?taskRpc('complete_own_task',{p_task_id:t.serverId}):taskRpc('reopen_project_task',{p_task_id:t.serverId,p_reason:'Reopened by manager'}))}
function ownerCompletion(id,overrideOnly=false){if(collabBusy)return;document.getElementById('owner-completion')?.remove();const o=document.createElement('div');o.id='owner-completion';o.className='modal-backdrop';o.innerHTML=`<form class="modal-dialog"><h2>Complete deliverable</h2><div hidden><select id="owner-mode"><option value="${overrideOnly?'override':'normal'}">Completion</option></select></div><div id="owner-delivery"><div class="field"><label>Delivery method</label><select id="owner-method"><option value="">Choose method</option>${[['instagram','Instagram DM'],['email','Email'],['google_drive','Google Drive'],['discord','Discord'],['text_message','Text message'],['in_person','In person'],['other','Other']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div><div class="field"><label>Deliverable URL (optional)</label><input id="owner-link" placeholder="https://"></div><div class="field"><label>Delivery notes</label><textarea id="owner-notes" maxlength="5000"></textarea></div></div><div class="field" id="owner-reason-wrap"><label>Reason for override (required)</label><textarea id="owner-reason" maxlength="2000"></textarea><p class="muted small">Recorded in task history.</p></div><div class="row"><button class="btn" type="submit">Complete task</button><button class="btn ghost" type="button">Cancel</button></div></form>`;document.body.appendChild(o);const q=x=>o.querySelector(x),mode=q('#owner-mode');const toggle=()=>{q('#owner-delivery').hidden=mode.value==='override';q('#owner-reason-wrap').hidden=mode.value!=='override'};mode.onchange=toggle;toggle();q('button[type=button]').onclick=()=>o.remove();q('form').onsubmit=async e=>{e.preventDefault();if(collabBusy)return;const over=mode.value==='override',reason=q('#owner-reason').value.trim(),method=q('#owner-method').value,link=q('#owner-link').value.trim(),notes=q('#owner-notes').value.trim();if(over&&reason.length<5)return alert('Provide a reason of at least five characters.');if(!over&&(!method||(link&&!/^https:\/\//i.test(link))||(method==='other'&&!notes&&!link)))return alert('Choose a delivery method and provide valid delivery details.');collabBusy=true;q('button[type=submit]').disabled=true;try{await taskRpc(over?'override_task_completion':'complete_own_deliverable',over?{p_task_id:id,p_reason:reason}:{p_task_id:id,p_delivery_method:method,p_deliverable_url:link||null,p_delivery_notes:notes});o.remove();await refreshOwnedTasks();render()}catch(e){alert(e.message)}finally{collabBusy=false;q('button[type=submit]').disabled=false}}}

function ownerTaskCheckbox(t,pid){const allowed=t.serverId&&(!t.assignedTo||t.assignedTo===cloudUser.id)&&t.status!=='submitted';return `<input type="checkbox" aria-label="Complete task" ${t.done?'checked':''} ${allowed?'':'disabled'} onchange="this.checked=!this.checked;ownerCheckById('${pid}','${t.id}',!this.checked)">`}
function ownerCheckById(pid,id,checked){const p=db.projects.find(p=>p.id===pid),t=p?.tasks.find(t=>t.id===id);if(!t?.serverId||collabBusy||t.status==='submitted'||(t.assignedTo&&t.assignedTo!==cloudUser.id))return;if(checked&&t.completionMethod==='deliverable'){ownerCompletion(t.serverId,false);return}if(checked&&t.completionMethod==='approval'&&!confirm('Confirm that you completed this task?'))return;collabAction(()=>checked?taskRpc('complete_own_task',{p_task_id:t.serverId}):taskRpc('reopen_project_task',{p_task_id:t.serverId,p_reason:'Reopened by manager'}))}
function collabTasks(p){return `<div class="panel"><div class="row between"><h2>Project tasks</h2>${btn('Refresh','collabAction(async()=>{})','ghost mini')}</div><div class="row"><input id="collab-title" style="flex:1" placeholder="New task">${btn('Add','createCollabTask()','')}</div><div class="field"><label>Completion method for new task</label><select id="collab-method">${completionOptions('simple')}</select></div>${p.tasks.map((t,i)=>`<div class="item">${ownerTaskCheckbox(t,p.id)}<div class="grow"><strong class="${t.done?'done':''}">${esc(t.text)}</strong><div class="muted small">${esc((t.status||'syncing').replaceAll('_',' '))} · ${taskMeta(t)} · ${esc(completionLabel(t.completionMethod))}</div></div>${t.serverId?`<div class="row">${t.completionMethod==='deliverable'&&!['completed','submitted'].includes(t.status)?btn('Override',`ownerCompletion('${t.serverId}',true)`,'ghost mini'):''}${!t.done?btn('Assign',`assignCollab(${i})`,'ghost mini'):''}${btn('Edit',`editCollab(${i})`,'ghost mini')}${!['submitted','completed'].includes(t.status)?btn('Completion method',`changeCompletion(${i})`,'ghost mini'):''}${t.status==='submitted'?btn('Review',`reviewCollab(${i})`,''):''}${btn('Archive',`archiveCollab(${i})`,'ghost mini')}</div>`:''}</div>`).join('')||'<p class="muted">No tasks yet.</p>'}</div>`}
function createCollabTask(){const p=project(),title=$('#collab-title').value.trim(),method=$('#collab-method').value;if(!title)return;collabAction(async()=>{const id=await ensureProjectRow(p);const taskId=await taskRpc('create_synced_task',{p_project_id:id,p_legacy_task_id:uid(),p_title:title,p_description:'',p_priority:'medium',p_due_date:null});if(method!=='simple')await taskRpc('set_task_completion_method',{p_task_id:taskId,p_method:method})})}
function editCollab(i){const t=project().tasks[i],title=prompt('Task title',t.text);if(!title?.trim())return;const due=prompt('Due date (YYYY-MM-DD or blank)',t.due);if(due===null)return;if(due&&!validISODate(due))return alert('Invalid date');const priority=prompt('Priority: low, medium, high, critical',t.priority);if(priority===null)return;collabAction(()=>taskRpc('update_project_task',{p_task_id:t.serverId,p_title:title,p_description:t.description||'',p_priority:priority,p_due_date:due||null}))}
function archiveCollab(i){const t=project().tasks[i];if(confirm('Archive this task?'))collabAction(()=>taskRpc('archive_project_task',{p_task_id:t.serverId,p_archive:true}))}
function assignCollab(i){const p=project(),t=p.tasks[i];collabAction(async()=>{const rows=await taskRpc('get_project_team',{p_project_id:await ensureProjectRow(p)});const options=[{user_id:null,display_name:'Unassigned'},{user_id:cloudUser.id,display_name:'Myself'},...rows];const v=prompt(options.map((r,j)=>j+': '+r.display_name).join('\n')+'\nEnter number');if(v===null)return;if(!/^\d+$/.test(v)||!options[Number(v)])throw Error('Invalid selection');await taskRpc('assign_project_task',{p_task_id:t.serverId,p_user_id:options[Number(v)].user_id})})}
function reviewCollab(i){const t=project().tasks[i];collabAction(async()=>{const {data,error}=await supa.from('task_submissions').select('*').eq('task_id',t.serverId).eq('review_status','pending').order('submitted_at',{ascending:false}).limit(1);if(error)throw error;const r=data[0];if(!r)throw Error('No pending submission');const choice=prompt(`${t.completionMethod==='approval'?'Completion approval request':'Delivery: '+r.delivery_method+'\n'+(r.deliverable_url||'')}\n${r.delivery_notes||''}\nEnter approve or revise`);if(choice===null)return;if(!['approve','revise'].includes(choice))throw Error('Invalid choice');const notes=prompt('Review notes','');if(notes===null)return;await taskRpc('review_project_task',{p_task_id:t.serverId,p_approve:choice==='approve',p_review_notes:notes})})}
function teamPanel(p){return `<div class="panel"><h2>Team</h2><div class="row"><input id="team-identifier" style="flex:1" placeholder="Username or email">${btn('Add member','addTeamMember()','')}</div>${btn('Load team','loadTeam()','ghost mini')}${teamProject===p.id?teamRows.map((r,i)=>`<div class="item"><div class="grow">${esc(r.display_name)}<div class="muted small">${r.active_tasks??0} active tasks</div></div><span class="pill">${esc(roleLabel(r.role))}</span>${r.role!=='owner'?btn(r.role==='co_admin'?'Demote':'Promote',`changeRole(${i})`,'ghost mini')+btn('Remove',`removeTeamMember(${i})`,'danger mini'):''}</div>`).join(''):''}</div>`}
async function fetchTeam(p){const id=await ensureProjectRow(p);const [work,roles]=await Promise.all([taskRpc('get_project_team',{p_project_id:id}),taskRpc('get_project_roles',{p_project_id:id})]);teamRows=roles.map(r=>({...work.find(w=>w.user_id===r.user_id),...r,display_name:r.full_name}));teamProject=p.id}
function loadTeam(){const p=project();collabAction(()=>fetchTeam(p))}
function addTeamMember(){const p=project(),v=$('#team-identifier').value.trim();if(!v)return;collabAction(async()=>{await taskRpc('add_project_member',{p_project_id:await ensureProjectRow(p),p_email:v});await fetchTeam(p)})}
function removeTeamMember(i){const p=project(),r=teamRows[i];if(!confirm('Remove member and unassign unfinished tasks?'))return;collabAction(async()=>{await taskRpc('remove_project_member',{p_project_id:await ensureProjectRow(p),p_user_id:r.user_id,p_replacement_id:null});await fetchTeam(p)})}
let memberGeneration=0,memberBusy=false;
async function memberWorkspace(){
 const generation=++memberGeneration,owner=cloudUser.id;
 shell('Shared workspace',btn('Refresh','memberWorkspace()','ghost'),'<div id="member-content" class="stack">Loading shared projects…</div>');
 const current=()=>view==='shared'&&cloudUser?.id===owner&&generation===memberGeneration;
 try{
 const projects=(await taskRpc('get_shared_projects',{})).filter(p=>p.manager_id!==owner);
 let tasks=[];
 if(projects.length){const {data,error}=await supa.from('project_tasks').select('*').in('project_id',projects.map(p=>p.project_id)).is('archived_at',null).order('due_date',{ascending:true,nullsFirst:false});if(error)throw error;tasks=data||[];}
 if(!current())return;
 const roles=await Promise.all(projects.map(p=>taskRpc('get_project_roles',{p_project_id:p.project_id})));if(!current())return;sharedAdminData=new Map(projects.map((p,i)=>[p.project_id,{p,roles:roles[i],tasks:tasks.filter(t=>t.project_id===p.project_id)}]));const status=t=>esc(t.status.replaceAll('_',' '));
 const actions=t=>{const id=t.id;if(t.assigned_to!==owner)return '';let a='';if(t.status==='pending_acceptance')a+=btn('Accept',`memberRespond('${id}',true)`,'')+btn('Decline',`memberRespond('${id}',false)`,'ghost');if(['accepted','revision_requested'].includes(t.status))a+=btn('Report blocker',`memberIssue('${id}','task_blocked')`,'ghost');if(['pending_acceptance','accepted','blocked','revision_requested'].includes(t.status))a+=btn('Ask manager',`memberIssue('${id}','clarification_requested')`,'ghost');return a;};
 const row=t=>`<div class="item"><input type="checkbox" aria-label="Complete task" ${t.status==='completed'?'checked':''} ${t.assigned_to===owner&&['accepted','blocked','revision_requested'].includes(t.status)?'':'disabled'} onchange="this.checked=false;memberCheck('${t.id}','${t.completion_method}')"><div class="grow"><strong class="${t.status==='completed'?'done':''}">${esc(t.title)}</strong><div class="muted small">${status(t)} · ${esc(completionLabel(t.completion_method))} · ${esc(t.priority)} priority · ${t.due_date?'Due '+esc(t.due_date):'No due date'}</div><p style="white-space:pre-wrap">${esc(t.description||'')}</p><div class="row">${actions(t)}</div></div></div>`;
 $('#member-content').innerHTML=`<div class="panel"><h2>My assignments</h2>${tasks.filter(t=>t.assigned_to===owner).map(t=>`<div class="muted small">${esc(projects.find(p=>p.project_id===t.project_id)?.name)}</div>${row(t)}`).join('')||'<p class="muted">No assignments yet.</p>'}</div><h2>Shared projects</h2>${projects.map(p=>`<div class="panel"><h2>${esc(p.name)}</h2><p class="muted small">Managed by ${esc(p.manager_name||'Project manager')} · ${esc(p.status)} · ${p.completed_tasks}/${p.total_tasks} tasks complete</p>${btn('Project brief',`memberBrief('${p.project_id}')`,'ghost mini')} ${esc(roleLabel(sharedAdminData.get(p.project_id).roles.find(r=>r.user_id===owner)?.role))}${sharedAdminData.get(p.project_id).roles.some(r=>r.user_id===owner&&r.role==='co_admin')?btn('Manage project',`sharedManage('${p.project_id}')`,''):''}<details><summary>All project tasks</summary>${tasks.filter(t=>t.project_id===p.project_id).map(row).join('')||'<p class="muted">No tasks yet.</p>'}</details></div>`).join('')||'<div class="empty">Projects you join will appear here.</div>'}`;
 }catch(e){if(current())$('#member-content').textContent='Unable to load shared workspace: '+e.message;}
}
async function memberAction(name,args){if(memberBusy)return;memberBusy=true;try{await taskRpc(name,args);if(view==='shared')await memberWorkspace();}catch(e){alert(e.message)}finally{memberBusy=false}}
function completionLabel(m){return ({simple:'Simple completion',approval:'Manager approval',deliverable:'Deliverable required'})[m]||'Unknown completion method'}
function completionOptions(m){return ['simple','approval','deliverable'].map(v=>`<option value="${v}" ${m===v?'selected':''}>${completionLabel(v)}</option>`).join('')}
function changeCompletion(i){const t=project()?.tasks[i];if(!t?.serverId)return;document.getElementById('completion-modal')?.remove();const o=document.createElement('div');o.id='completion-modal';o.className='modal-backdrop';o.innerHTML=`<form class="modal-dialog"><h2>Completion method</h2><p>${esc(t.text)}</p><select id="completion-choice">${completionOptions(t.completionMethod)}</select><p class="muted small">Simple: no review. Approval: review without delivery details. Deliverable: delivery details and review.</p><div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" onclick="document.getElementById('completion-modal').remove()">Cancel</button></div></form>`;document.body.appendChild(o);o.querySelector('form').onsubmit=e=>{e.preventDefault();const method=o.querySelector('select').value;o.remove();collabAction(()=>taskRpc('set_task_completion_method',{p_task_id:t.serverId,p_method:method}))}}
function memberCheck(id,method){if(memberBusy)return;if(method==='simple')memberAction('complete_simple_task',{p_task_id:id});else if(method==='approval')memberApproval(id);else if(method==='deliverable')memberSubmit(id)}
function memberApproval(id){const notes=prompt('Optional completion notes','');if(notes===null)return;memberAction('request_task_approval',{p_task_id:id,p_notes:notes})}
function memberRespond(id,accept){let reason=accept?'':prompt('Reason for declining (optional)','');if(reason===null)return;memberAction('respond_to_task',{p_task_id:id,p_accept:accept,p_reason:reason})}
function memberIssue(id,type){const message=prompt(type==='task_blocked'?'What is blocking your work?':'What would you like to ask the manager?');if(!message?.trim())return;memberAction('report_task_issue',{p_task_id:id,p_issue_type:type,p_message:message.trim()})}
function memberSubmit(id){document.getElementById('member-submit')?.remove();const o=document.createElement('div');o.id='member-submit';o.className='modal-backdrop';o.innerHTML=`<form class="modal-dialog"><h2>Submit completed work</h2><div class="field"><label>Delivery method</label><select id="member-method" required>${[['instagram','Instagram DM'],['email','Email'],['google_drive','Google Drive'],['discord','Discord'],['text_message','Text message'],['in_person','In person'],['other','Other']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div><div class="field"><label>Deliverable link (optional)</label><input id="member-link" type="url" placeholder="https://..."></div><div class="field"><label>Delivery notes</label><textarea id="member-notes" placeholder="Where did you send the work?"></textarea></div><div class="row"><button class="btn" type="submit">Submit for review</button><button class="btn ghost" type="button" onclick="document.getElementById('member-submit').remove()">Cancel</button></div></form>`;document.body.appendChild(o);o.querySelector('form').onsubmit=async e=>{e.preventDefault();if(memberBusy)return;const method=$('#member-method').value,link=$('#member-link').value.trim(),notes=$('#member-notes').value.trim();if(link&&!/^https:\/\//i.test(link))return alert('Use an HTTPS link.');if(method==='other'&&!notes)return alert('Describe the delivery method.');memberBusy=true;try{await taskRpc('submit_project_task',{p_task_id:id,p_delivery_method:method,p_deliverable_url:link||null,p_delivery_notes:notes});o.remove();if(view==='shared')await memberWorkspace()}catch(e){alert(e.message)}finally{memberBusy=false}}}
async function memberBrief(id){const owner=cloudUser.id;try{const rows=await taskRpc('get_shared_project_details',{p_project_id:id});if(view!=='shared'||cloudUser?.id!==owner)return;const p=rows?.[0];if(!p)return alert('Project is no longer available.');alert([p.name,p.description,p.goal?'Goal: '+p.goal:'',p.success_criteria?'Success: '+p.success_criteria:'',p.deadline?'Deadline: '+p.deadline:''].filter(Boolean).join('\n\n'))}catch(e){alert(e.message)}}


function roleLabel(r){return ({owner:'Owner',co_admin:'Co-admin',member:'Member'})[r]||'Member'}
function changeRole(i){const p=project(),r=teamRows[i];if(!r||r.role==='owner')return;const role=r.role==='co_admin'?'member':'co_admin';if(!confirm('Change '+r.display_name+' to '+roleLabel(role)+'?'))return;collabAction(async()=>{await taskRpc('set_project_member_role',{p_project_id:await ensureProjectRow(p),p_user_id:r.user_id,p_role:role});await fetchTeam(p)})}
let sharedAdminData=new Map(),sharedAdminId=null;
async function sharedManage(id){if(view!=='shared')return;const user=cloudUser.id;try{const roles=await taskRpc('get_project_roles',{p_project_id:id});if(view!=='shared'||cloudUser?.id!==user)return;if(!roles.some(r=>r.user_id===user&&r.role==='co_admin'))throw Error('Co-admin access required');const {data,error}=await supa.from('project_tasks').select('*').eq('project_id',id).is('archived_at',null);if(error)throw error;if(view!=='shared'||cloudUser?.id!==user)return;const work=await taskRpc('get_project_team',{p_project_id:id});if(view!=='shared'||cloudUser?.id!==user)return;sharedAdminId=id;sharedAdminData.set(id,{...sharedAdminData.get(id),roles,tasks:data,work});const x=sharedAdminData.get(id);shell(esc(x.p?.name||'Shared project'),btn('Back to shared','memberWorkspace()','ghost'),`<div class="notice">Co-admin workspace · Task and team management. Project brief editing and private Consultant are not available here.</div><div class="panel"><h2>Tasks</h2><div class="row"><input id="sa-title" placeholder="New task"><select id="sa-method">${completionOptions('simple')}</select>${btn('Add',"sharedAdminAction('create')",'')}</div>${data.map((t,i)=>`<div class="item"><input type="checkbox" ${t.status==='completed'?'checked':''} ${(!t.assigned_to||t.assigned_to===user)&&!['submitted','pending_acceptance','declined'].includes(t.status)?'':'disabled'} onchange="this.checked=!this.checked;sharedAdminAction('check',${i})"><div class="grow"><strong class="${t.status==='completed'?'done':''}">${esc(t.title)}</strong><div class="muted small">${esc(t.status)} · ${esc(completionLabel(t.completion_method))} · ${esc(roles.find(r=>r.user_id===t.assigned_to)?.full_name||'Unassigned')} · ${esc(t.due_date||'No due date')}</div><div class="row">${btn('Edit',`sharedAdminAction('edit',${i})`,'ghost mini')}${t.status!=='completed'?btn('Assign',`sharedAdminAction('assign',${i})`,'ghost mini'):''}${!['completed','submitted'].includes(t.status)?btn('Method',`sharedAdminAction('method',${i})`,'ghost mini'):''}${t.status==='submitted'?btn('Review',`sharedAdminAction('review',${i})`,''):''}${t.completion_method==='deliverable'&&!['completed','submitted'].includes(t.status)?btn('Override',`sharedAdminAction('override',${i})`,'ghost mini'):''}${btn('Archive',`sharedAdminAction('archive',${i})`,'ghost mini')}</div></div></div>`).join('')}</div><div class="panel"><h2>Team</h2><div class="row"><input id="sa-person" placeholder="Username or email">${btn('Add member',"sharedAdminAction('add')",'')}</div>${roles.map((r,i)=>`<div class="item"><div class="grow">${esc(r.full_name)} <span class="pill">${roleLabel(r.role)}</span><div class="muted small">${work.find(w=>w.user_id===r.user_id)?.active_tasks??0} active tasks</div></div>${r.role==='member'?btn('Remove',`sharedAdminAction('remove',${i})`,'danger mini'):''}</div>`).join('')}</div>`)}catch(e){alert(e.message)}}
async function sharedAdminAction(action,i){if(collabBusy)return;const id=sharedAdminId,x=sharedAdminData.get(id),t=x?.tasks[i];if(!x)return;collabBusy=true;try{let name,args;const task={p_task_id:t?.id};if(action==='create'){const title=$('#sa-title').value.trim(),method=$('#sa-method').value;if(!title)return;const tid=await taskRpc('create_project_task',{p_project_id:id,p_title:title});if(method!=='simple')await taskRpc('set_task_completion_method',{p_task_id:tid,p_method:method});}else if(action==='add'){const v=$('#sa-person').value.trim();if(!v)return;await taskRpc('add_project_member',{p_project_id:id,p_email:v})}else if(action==='remove'){const r=x.roles[i];if(r.role!=='member'||!confirm('Remove member and unassign unfinished tasks?'))return;await taskRpc('remove_project_member',{p_project_id:id,p_user_id:r.user_id,p_replacement_id:null})}else if(action==='assign'){const options=[{user_id:null,full_name:'Unassigned'},...x.roles];const v=prompt(options.map((r,j)=>j+': '+r.full_name).join('\n'));if(v===null||!/^\d+$/.test(v)||!options[+v])return;await taskRpc('assign_project_task',{...task,p_user_id:options[+v].user_id})}else if(action==='edit'){const title=prompt('Title',t.title);if(!title?.trim())return;const desc=prompt('Description',t.description||'');if(desc===null)return;const due=prompt('Due date (YYYY-MM-DD or blank)',t.due_date||'');if(due===null)return;if(due&&!validISODate(due))throw Error('Invalid date');const priority=prompt('Priority',t.priority);if(priority===null)return;await taskRpc('update_project_task',{...task,p_title:title,p_description:desc,p_priority:priority,p_due_date:due||null})}else if(action==='method'){const m=prompt('simple, approval, or deliverable',t.completion_method);if(m===null)return;await taskRpc('set_task_completion_method',{...task,p_method:m})}else if(action==='review'){const {data,error}=await supa.from('task_submissions').select('*').eq('task_id',t.id).eq('review_status','pending').order('submitted_at',{ascending:false}).limit(1);if(error)throw error;const r=data[0];if(!r)throw Error('No pending submission');const v=prompt([r.delivery_method,r.deliverable_url,r.delivery_notes,'Enter approve or revise'].filter(Boolean).join('\n'));if(!['approve','revise'].includes(v))return;const notes=prompt('Review notes','');if(notes===null)return;await taskRpc('review_project_task',{...task,p_approve:v==='approve',p_review_notes:notes})}else if(action==='archive'){if(!confirm('Archive task?'))return;await taskRpc('archive_project_task',{...task,p_archive:true})}else if(action==='override'){const reason=prompt('Reason for override');if(!reason)return;await taskRpc('override_task_completion',{...task,p_reason:reason})}else if(action==='check'){if(t.status==='completed'){if(!confirm('Reopen task?'))return;await taskRpc('reopen_project_task',{...task,p_reason:'Reopened by co-admin'})}else if(t.completion_method==='deliverable'){const method=prompt('Delivery method: instagram, email, google_drive, discord, text_message, in_person, other');if(!method)return;const link=prompt('HTTPS delivery link (optional)','');if(link===null)return;const notes=prompt('Delivery notes','');if(notes===null)return;await taskRpc('complete_own_deliverable',{...task,p_delivery_method:method,p_deliverable_url:link||null,p_delivery_notes:notes})}else{if(t.completion_method==='approval'&&!confirm('Confirm completion?'))return;await taskRpc('complete_own_task',task)}}if(view==='shared'&&sharedAdminId===id)await sharedManage(id)}catch(e){alert(e.message)}finally{collabBusy=false}}

initProjectOS();
</script><script>
