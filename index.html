<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Project OS</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8edf5;background:#0c1018}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}.shell{max-width:1150px;margin:auto;display:grid;grid-template-columns:230px 1fr;min-height:100dvh}.sidebar{padding:26px 15px;background:#111723;border-right:1px solid #283244}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;padding:4px 12px 28px}.brand span{color:#a78bfa}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:transparent;color:#aab6c8;text-align:left;padding:13px;border-radius:11px}.nav button.active,.nav button:hover{background:#242d40;color:white}.main{padding:32px 36px 90px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:26px}h1{font-size:30px;margin:0;letter-spacing:-.7px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 9px}.muted{color:#98a6bb}.small{font-size:13px}.btn{background:#9f86fa;color:#100d22;padding:11px 15px;border-radius:10px;font-weight:750}.btn:hover{background:#b6a2ff}.secondary{background:#263248;color:#e5eafa}.danger{background:#512a36;color:#ffdce4}.ghost{background:transparent;color:#b9c5d6;border:1px solid #39455a}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px;margin-bottom:24px}.card,.panel{background:#171f2d;border:1px solid #2b3649;border-radius:16px;padding:19px}.stat{font-size:30px;font-weight:800;margin:8px 0 0}.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.project-card{cursor:pointer;transition:transform .1s,border-color .1s}.project-card:hover{transform:translateY(-2px);border-color:#8068d8}.pill{display:inline-block;border-radius:50px;background:#2c3550;color:#cfc4ff;padding:5px 9px;font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:13px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{color:#aebbd0;font-size:13px;font-weight:650}input,textarea,select{width:100%;background:#0e1521;border:1px solid #364258;border-radius:10px;color:#f0f3fa;padding:12px;min-width:0}textarea{min-height:94px;resize:vertical}select{appearance:auto}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(245px,1fr);gap:15px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px;margin-bottom:13px}.tabs button{white-space:nowrap;border-radius:9px;background:#202b3d;color:#aebbd0;padding:10px 12px}.tabs button.active{background:#6754b6;color:white}.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #2b3649}.item:last-child{border:0}.item input[type=checkbox]{width:19px;height:19px;margin:2px 0;accent-color:#a78bfa}.item .grow{flex:1;min-width:0}.done{text-decoration:line-through;color:#8390a5}.mini{padding:6px 9px;border-radius:7px;font-size:12px}.empty{padding:28px;text-align:center;color:#99a7ba;border:1px dashed #405069;border-radius:14px}.notice{border-left:3px solid #a78bfa;padding:13px 15px;background:#23243c;border-radius:6px;color:#d9d3f8;margin-bottom:20px}.prompt{border:1px solid #3a465b;background:#101825;border-radius:12px;padding:14px;margin:12px 0}.prompt strong{display:block;margin-bottom:7px}.steps{display:grid;gap:11px}.step{border-left:2px solid #6955bd;padding:2px 0 2px 14px}.step p{margin:5px 0 0;color:#a8b5c9;font-size:13px}.footer{color:#8795ab;font-size:12px;margin-top:28px}.mobile-nav{display:none}@media(max-width:750px){.shell{display:block}.sidebar{display:none}.main{padding:23px 16px 110px}.top h1{font-size:25px}.split{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111723;border-top:1px solid #344055;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:4}.mobile-nav button{background:none;color:#aebbd0;font-size:11px;padding:7px 3px}.mobile-nav button.active{color:#c2b2ff}.project-grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}}@media print{body{background:white;color:black}.sidebar,.mobile-nav,.top button,.tabs,.no-print,.footer{display:none!important}.shell{display:block}.main{padding:0}.panel,.card{border:1px solid #ccc;background:white;color:black;break-inside:avoid}.muted,.small{color:#444!important}input,textarea{border:0;color:black}.print-only{display:block!important}}.print-only{display:none}
</style></head><body><div id="app"></div><script>
const KEY='project-os-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{projects:[]}}catch{db={projects:[]}};let view='home',selected=null,tab='overview';const phases=['Brainstorm','Differentiate','Possibilities','Constraints','Introduce','Execute','Measure','Diagnose','Adjust','Repeat'];const prompts={Brainstorm:'What is the idea, and what do you want to accomplish?',Differentiate:'What makes this worth doing instead of an ordinary alternative?',Possibilities:'What resources, opportunities, skills, or connections could help?',Constraints:'What limits exist? Which could inspire a different approach?',Introduce:'Who needs to understand, support, or experience this idea?',Execute:'What would a realistic first version look like?',Measure:'What observations would indicate success or failure?',Diagnose:'If results disappoint, what possible explanations should we investigate?',Adjust:'What would we change based on evidence?',Repeat:'What should the next iteration test?'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function project(){return db.projects.find(p=>p.id===selected)}function go(v){view=v;render()}function openProject(id){selected=id;view='project';tab='overview';render()}function btn(label,fn,cl='secondary'){return `<button class="btn ${cl}" onclick="${fn}">${label}</button>`}function nav(){let n=[['home','⌂','Home'],['projects','▣','Projects'],['tasks','☑','Tasks'],['lists','☷','Lists'],['settings','⚙','Settings']];return `<aside class="sidebar"><div class="brand">PROJECT <span>OS</span></div><div class="nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div></aside><nav class="mobile-nav">${n.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><div style="font-size:19px">${x[1]}</div>${x[2]}</button>`).join('')}</nav>`}function shell(title,actions,content){$('#app').innerHTML=`<div class="shell">${nav()}<main class="main"><div class="top"><h1>${title}</h1><div class="row no-print">${actions||''}</div></div>${content}<div class="footer">Project OS · Local prototype · Your data is saved in this browser. Export backups regularly.</div></main></div>`}function summary(){let tasks=db.projects.flatMap(p=>p.tasks||[]);return {projects:db.projects.length,open:tasks.filter(t=>!t.done).length,done:tasks.filter(t=>t.done).length,items:db.projects.flatMap(p=>p.items||[]).filter(i=>!i.done).length}}function projCard(p){let all=p.tasks.length,done=p.tasks.filter(t=>t.done).length;return `<div class="card project-card" onclick="openProject('${p.id}')"><div class="row between"><span class="pill">${esc(p.status)}</span><span class="muted small">${all?Math.round(done/all*100):0}%</span></div><h2 style="margin:17px 0 7px">${esc(p.name)}</h2><p class="muted small">${esc(p.description||'No description yet')}</p><div class="muted small">${done}/${all} tasks complete</div></div>`}function home(){let s=summary();shell('Your workspace',btn('+ New project','createProject()',''),`<p class="muted">A place to think clearly, plan deliberately, and make progress.</p><div class="cards"><div class="card"><div class="muted small">Projects</div><div class="stat">${s.projects}</div></div><div class="card"><div class="muted small">Open tasks</div><div class="stat">${s.open}</div></div><div class="card"><div class="muted small">Completed tasks</div><div class="stat">${s.done}</div></div><div class="card"><div class="muted small">Unchecked items</div><div class="stat">${s.items}</div></div></div><h2>Projects</h2>${db.projects.length?`<div class="project-grid">${db.projects.map(projCard).join('')}</div>`:`<div class="empty">No projects yet. Create one to begin idea proofing and planning.<br><br>${btn('Create your first project','createProject()','')}</div>`}`)}function projects(){shell('Projects',btn('+ New project','createProject()',''),db.projects.length?`<div class="project-grid">${db.projects.map(projCard).join('')}</div>`:`<div class="empty">Your projects will appear here.</div>`)}function createProject(){let name=prompt('What is your project called?');if(!name?.trim())return;let description=prompt('Describe your idea in a sentence or two (optional):')||'';let p={id:uid(),name:name.trim(),description,status:'Idea proofing',goal:'',success:'',audience:'',budget:'',deadline:'',tasks:[],items:[],notes:'',phases:{},decisions:[],created:new Date().toISOString()};db.projects.unshift(p);save();openProject(p.id)}function field(label,key,area=false){let p=project(),value=esc(p[key]||'');return `<div class="field"><label>${label}</label>${area?`<textarea oninput="setField('${key}',this.value)">${value}</textarea>`:`<input value="${value}" oninput="setField('${key}',this.value)">`}</div>`}function setField(k,v){project()[k]=v;save()}function changeStatus(v){project().status=v;save();render()}function phaseContent(){let p=project();return `<div class="notice">The Idea Loop is a structured reflection tool, not an AI chat. Use it to record reasoning, uncertainty, experiments, and lessons.</div><div class="steps">${phases.map((ph,i)=>`<div class="step"><h3>${i+1}. ${ph}</h3><p>${prompts[ph]}</p><textarea aria-label="${ph}" placeholder="Your reasoning, evidence, questions, or next experiment..." oninput="setPhase('${ph}',this.value)">${esc(p.phases[ph]||'')}</textarea></div>`).join('')}</div>`}function setPhase(ph,v){project().phases[ph]=v;save()}function checkItem(type,id,checked){let x=project()[type].find(x=>x.id===id);if(x){x.done=checked;save();render()}}function addItem(type){let v=$('#new-'+type)?.value.trim();if(!v)return;project()[type].push({id:uid(),text:v,done:false});save();render()}function removeItem(type,id){project()[type]=project()[type].filter(x=>x.id!==id);save();render()}function listEditor(type,label){let p=project();return `<div class="panel"><h2>${label}</h2><div class="row no-print" style="margin-bottom:10px"><input style="flex:1" id="new-${type}" placeholder="Add ${type==='tasks'?'a task':'an item'}..." onkeydown="if(event.key==='Enter')addItem('${type}')">${btn('Add',`addItem('${type}')`,'')}</div>${p[type].length?p[type].map(x=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="checkItem('${type}','${x.id}',this.checked)"><div class="grow ${x.done?'done':''}">${esc(x.text)}</div><button class="mini ghost no-print" onclick="removeItem('${type}','${x.id}')">Remove</button></div>`).join(''):`<div class="muted small">Nothing here yet.</div>`}</div>`}function decision(){let d=prompt('What decision did you make?');if(!d?.trim())return;let why=prompt('Why? Include evidence, assumptions, and tradeoffs:')||'';project().decisions.unshift({id:uid(),decision:d,why,date:new Date().toLocaleDateString()});save();render()}function projectView(){let p=project();if(!p){go('projects');return}let tabs=[['overview','Overview'],['consultant','AI Consultant'],['proof','Idea Loop'],['tasks','Tasks'],['items','Item lists'],['notes','Documents'],['decisions','Decisions']];let actions=`${btn('Print / PDF','printProject()','secondary')}${btn('Export JSON','exportProject()','ghost')}`;let content=`<div class="row between" style="margin-bottom:17px"><div class="muted small">Created ${new Date(p.created).toLocaleDateString()}</div><select style="width:auto" onchange="changeStatus(this.value)">${['Idea proofing','Planning','In progress','On hold','Completed','Archived'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tabs no-print">${tabs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
if(tab==='overview')content+=`<div class="split"><div class="panel"><h2>Project brief</h2>${field('Project name','name')}${field('The idea','description',true)}${field('Goal / purpose','goal',true)}${field('What would success look like?','success',true)}${field('Who is it for?','audience')}</div><div class="stack"><div class="panel"><h2>Practical constraints</h2>${field('Budget / resources','budget')}${field('Target date','deadline')}<p class="muted small">A date is a preference until its feasibility and dependencies are checked.</p></div><div class="panel"><h2>Critical questions</h2><div class="muted small">Why does this matter? What assumptions could be wrong? What is the cheapest useful experiment? What would make you change course?</div></div></div></div>`;
if(tab==='consultant')content+=consultantPanel();if(tab==='proof')content+=`<div class="panel"><h2>Idea proofing</h2>${phaseContent()}</div>`;
if(tab==='tasks')content+=listEditor('tasks','Project tasks');if(tab==='items')content+=listEditor('items','Shopping, supplies & equipment');if(tab==='notes')content+=`<div class="panel"><h2>Project notes</h2><p class="muted small">Meeting notes, research, references, draft copy, and anything worth keeping.</p><textarea style="min-height:350px" oninput="setField('notes',this.value)">${esc(p.notes)}</textarea></div>`;if(tab==='decisions')content+=`<div class="panel"><div class="row between"><h2>Decision log</h2>${btn('+ Record decision','decision()','')}</div>${p.decisions.length?p.decisions.map(d=>`<div class="item"><div><strong>${esc(d.decision)}</strong><div class="muted small">${esc(d.date)}</div><p>${esc(d.why)}</p></div></div>`).join(''):`<p class="muted">Record decisions and their rationale so you can revisit them later.</p>`}</div>`;shell(esc(p.name),actions,content)}function allList(type){let rows=db.projects.flatMap(p=>p[type].map(x=>({...x,projectName:p.name,projectId:p.id})));shell(type==='tasks'?'All tasks':'All item lists',btn('+ New project','createProject()',''),rows.length?`<div class="panel">${rows.map(x=>`<div class="item"><span>${x.done?'✓':'○'}</span><div class="grow ${x.done?'done':''}">${esc(x.text)}<div class="muted small">${esc(x.projectName)}</div></div>${btn('Open',`openProject('${x.projectId}');tab='${type}';render()`,'ghost')}</div>`).join('')}</div>`:`<div class="empty">No ${type} yet. Open a project to add some.</div>`)}function download(filename,text,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportProject(){download((project().name||'project').replace(/[^a-z0-9-]/gi,'_')+'.json',JSON.stringify(project(),null,2),'application/json')}function exportAll(){download('project-os-backup.json',JSON.stringify(db,null,2),'application/json')}function importAll(e){let f=e.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.projects))throw Error();if(!confirm('Replace all local projects with this backup?'))return;db=obj;save();go('home')}catch{alert('This is not a valid Project OS backup.')}};r.readAsText(f)}function printProject(){let p=project();let html=`<h1>${esc(p.name)}</h1><p>${esc(p.description)}</p><h2>Project brief</h2><p><b>Status:</b> ${esc(p.status)}</p><p><b>Goal:</b> ${esc(p.goal)}</p><p><b>Success:</b> ${esc(p.success)}</p><p><b>Audience:</b> ${esc(p.audience)}</p><p><b>Budget:</b> ${esc(p.budget)}</p><p><b>Target date:</b> ${esc(p.deadline)}</p><h2>Idea Loop</h2>${phases.map(x=>`<h3>${x}</h3><p>${esc(p.phases[x]||'—').replace(/\n/g,'<br>')}</p>`).join('')}<h2>Tasks</h2><ul>${p.tasks.map(x=>`<li>${x.done?'☑':'☐'} ${esc(x.text)}</li>`).join('')}</ul><h2>Item lists</h2><ul>${p.items.map(x=>`<li>${x.done?'☑':'☐'} ${esc(x.text)}</li>`).join('')}</ul><h2>Notes</h2><p>${esc(p.notes).replace(/\n/g,'<br>')}</p><h2>Decisions</h2>${p.decisions.map(d=>`<p><b>${esc(d.decision)}</b> (${esc(d.date)}) — ${esc(d.why)}</p>`).join('')}`;let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print this project.');return}w.document.write(`<!doctype html><html><head><title>${esc(p.name)} — Project OS</title><meta name="viewport" content="width=device-width"><style>body{font-family:Arial,sans-serif;color:#222;max-width:760px;margin:35px auto;padding:0 18px;line-height:1.5}h1{border-bottom:3px solid #222;padding-bottom:12px}h2{margin-top:28px;border-bottom:1px solid #ccc}h3{margin-bottom:3px}p{white-space:normal;overflow-wrap:anywhere}@media print{body{margin:0;max-width:none}}</style></head><body>${html}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}function settings(){shell('Settings','',`<div class="stack"><div class="panel"><h2>Your data</h2><p class="muted">This prototype stores projects in this browser only. It does not synchronize across devices or accounts. Export a backup before clearing browser data or switching phones.</p><div class="row">${btn('Download all projects','exportAll()','') }<label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importAll(this)"></label></div></div><div class="panel"><h2>About this prototype</h2><p class="muted">Works without an account and without an AI API. Idea proofing is a guided worksheet, not an automated consultant. PDF export uses your browser's print dialog: choose Save as PDF. Sharing a JSON backup transfers a copy, not a live collaborative workspace.</p></div></div>`)}
const WORKER_URL='https://project-os-ai.isaacm1298.workers.dev/';
let accessPassword='',consultantBusy=false;
function consultantPanel(){
  const p=project(); const chat=p.chat||[];
  return `<div class="panel"><div class="row between"><h2>AI Project Consultant</h2><button class="btn ghost mini no-print" onclick="accessPassword='';alert('Access password cleared for this session.')">Clear password</button></div><p class="muted small">Challenge assumptions, explore options, and plan experiments. Chat is saved only in this browser. AI replies are not automatically applied to tasks or documents.</p><div id="chat-log" style="display:grid;gap:12px;max-height:55vh;overflow-y:auto;margin:15px 0;padding:4px">${chat.length?chat.map(m=>`<div style="background:${m.role==='user'?'#2b3151':'#101825'};border:1px solid #39445b;border-radius:13px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere"><strong style="color:#c3b6ff">${m.role==='user'?'You':'Project OS'}</strong><div style="margin-top:7px">${esc(m.content)}</div></div>`).join(''):`<div class="notice">Start by describing your idea. I'll ask questions and help test your reasoning.</div>`}</div><div class="field no-print"><label for="consultant-message">Your message</label><textarea id="consultant-message" placeholder="I have an idea for..." style="min-height:110px"></textarea></div><div class="row no-print"><button id="consultant-send" class="btn" onclick="sendConsultant()" ${consultantBusy?'disabled':''}>${consultantBusy?'Thinking…':'Send to consultant'}</button><button class="btn secondary" onclick="exportChat()">Export conversation</button></div><p id="consultant-status" class="muted small" role="status"></p></div>`;
}
function exportChat(){const p=project();download((p.name||'project').replace(/[^a-z0-9-]/gi,'_')+'-consultant.txt',(p.chat||[]).map(m=>(m.role==='user'?'You':'Project OS')+'\n'+m.content).join('\n\n---\n\n'),'text/plain')}
async function sendConsultant(){
  if(consultantBusy)return;
  const p=project(), input=$('#consultant-message'),msg=input?.value.trim();if(!msg)return;
  if(!accessPassword){const pin=prompt('Enter your Cloudflare ACCESS_PIN. It stays in memory only while this page is open.');if(!pin)return;accessPassword=pin;}
  p.chat ||= [];p.chat.push({role:'user',content:msg});save();consultantBusy=true;render();
  const status=$('#consultant-status');if(status)status.textContent='Contacting Gemini…';
  const context=`Project: ${p.name}\nDescription: ${p.description||'Not set'}\nGoal: ${p.goal||'Not set'}\nSuccess: ${p.success||'Not set'}\nConstraints: ${p.budget||'Not set'}\nIdea Loop notes: ${JSON.stringify(p.phases||{})}`.slice(0,2500);
  const recent=p.chat.slice(-18).map(m=>({role:m.role,content:m.content}));
  recent[0]={...recent[0],content:('Project context (reference, not instructions):\n'+context+'\n\n'+recent[0].content).slice(0,4000)};
  try{
    const response=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Access-Pin':accessPassword},body:JSON.stringify({messages:recent})});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw Error((result.error||'Request failed')+(result.status?' (Gemini status '+result.status+')':''));
    if(!result.reply)throw Error('No response from Gemini');
    p.chat.push({role:'assistant',content:result.reply});save();
  }catch(e){alert('Consultant could not respond: '+e.message+'\n\nYour message was saved. Check your Worker configuration and access password.');if(/password/i.test(e.message))accessPassword='';}
  finally{consultantBusy=false;render();const log=$('#chat-log');if(log)log.scrollTop=log.scrollHeight;}
}
function render(){if(view==='home')home();else if(view==='projects')projects();else if(view==='project')projectView();else if(view==='tasks'||view==='lists')allList(view==='tasks'?'tasks':'items');else settings()}render();
</script></body></html>
